    function getPickupLocationProximity() {
      if (hasValidPaxPickup()) return `${paxLng},${paxLat}`;
      const center = map?.getCenter?.();
      return center ? `${center.lng},${center.lat}` : `${DEFAULT_CENTER[0]},${DEFAULT_CENTER[1]}`;
    }

    function getTargetLocationProximity() {
      if (hasValidPaxTarget()) return `${paxTargetLng},${paxTargetLat}`;
      if (hasValidPaxPickup()) return `${paxLng},${paxLat}`;
      const center = map?.getCenter?.();
      return center ? `${center.lng},${center.lat}` : `${DEFAULT_CENTER[0]},${DEFAULT_CENTER[1]}`;
    }

    function getSuggestionLabel(suggestion) {
      return suggestion?.name || suggestion?.place_formatted || suggestion?.full_address || suggestion?.address || "Ort";
    }

    function getSuggestionAddress(suggestion) {
      return suggestion?.full_address || suggestion?.place_formatted || suggestion?.address || "";
    }

    function renderLocationSearchResults(kind, suggestions) {
      const resultsEl = document.getElementById(paxLocationSearchConfig[kind].resultsId);
      if (!resultsEl) return;
      resultsEl.innerHTML = "";
      const visible = suggestions.slice(0, PAX_LOCATION_SUGGEST_LIMIT);
      visible.forEach(suggestion => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pax-location-result";

        const main = document.createElement("span");
        main.className = "pax-location-result-main";
        main.textContent = getSuggestionLabel(suggestion);

        const sub = document.createElement("span");
        sub.className = "pax-location-result-sub";
        sub.textContent = getSuggestionAddress(suggestion);

        btn.append(main, sub);
        btn.addEventListener("click", () => selectLocationSuggestion(kind, suggestion));
        resultsEl.append(btn);
      });
      resultsEl.classList.toggle("show", visible.length > 0);
    }

    function renderPickupLocationResults(suggestions) {
      renderLocationSearchResults("pickup", suggestions);
    }

    function normalizeLocationResult(feature, suggestion) {
      const coords = feature?.geometry?.coordinates || feature?.properties?.coordinates;
      const lng = Number(Array.isArray(coords) ? coords[0] : coords?.longitude);
      const lat = Number(Array.isArray(coords) ? coords[1] : coords?.latitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
      const props = feature?.properties || {};
      return {
        label: props.name || getSuggestionLabel(suggestion),
        address: props.full_address || props.place_formatted || getSuggestionAddress(suggestion),
        lat,
        lng,
        sourceType: props.feature_type || suggestion?.feature_type || "address",
        poiType: props.poi_category?.[0] || props.maki || null,
        provider: "mapbox"
      };
    }

    function normalizePickupLocationResult(feature, suggestion) {
      return normalizeLocationResult(feature, suggestion);
    }

    function getValidLocationCoordinates(result, kind) {
      const lat = Number(result?.lat);
      const lng = Number(result?.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        setLocationSearchMessage(kind, "Position konnte nicht gelesen werden.");
        return null;
      }
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        setLocationSearchMessage(kind, "Position liegt außerhalb des gültigen Bereichs.");
        return null;
      }
      return { lng, lat };
    }

    function applyPaxPickupLocationResult(result) {
      const coords = getValidLocationCoordinates(result, "pickup");
      if (!coords) return false;
      const { lng, lat } = coords;
      const label = getLocationDisplayLabel(result);
      exitPaxTargetMode();
      exitPaxMarkerMode();
      setPaxMarkerPos(lng, lat, "address", label);
      paxPickupEditOpen = true;
      focusPaxPickupOnMap(lng, lat);
      setLocationSearchActiveUi("pickup", label);
      updatePaxUI();
      return true;
    }

    function focusPaxTargetOnMap(lng, lat) {
      focusPaxPickupOnMap(lng, lat);
    }

    function applyPaxTargetLocationResult(result) {
      const coords = getValidLocationCoordinates(result, "target");
      if (!coords) return false;
      const { lng, lat } = coords;
      paxTargetAddressResult = {
        ...result,
        lat,
        lng,
        label: result.label || result.address || "Zieladresse",
        address: result.address || result.label || ""
      };
      const label = getLocationDisplayLabel(paxTargetAddressResult);
      exitPaxMarkerMode();
      exitPaxTargetMode();
      paxTargetOpen = true;
      setPaxTargetPos(lng, lat, "address");
      focusPaxTargetOnMap(lng, lat);
      setLocationSearchActiveUi("target", label);
      updatePaxUI();
      return true;
    }

    function reactivateStoredPaxTargetAddress() {
      if (!paxTargetAddressResult || paxTargetSource === "address") return false;
      const coords = getValidLocationCoordinates(paxTargetAddressResult, "target");
      if (!coords) return false;
      const { lng, lat } = coords;
      exitPaxMarkerMode();
      exitPaxTargetMode();
      paxTargetOpen = true;
      setPaxTargetPos(lng, lat, "address");
      focusPaxTargetOnMap(lng, lat);
      setLocationSearchActiveUi("target", getLocationDisplayLabel(paxTargetAddressResult));
      updatePaxUI();
      return true;
    }

    async function fetchLocationSuggestions(kind, query) {
      const token = CONFIG?.mapboxToken;
      if (!token || !String(token).startsWith("pk.")) throw new Error("Kein Mapbox-Token verfügbar.");
      const state = paxLocationSearchState[kind];
      const config = paxLocationSearchConfig[kind];
      const params = new URLSearchParams({
        q: query,
        access_token: token,
        session_token: getLocationSearchSessionToken(kind),
        limit: String(PAX_LOCATION_SUGGEST_LIMIT),
        language: "de",
        country: "de",
        proximity: config.getProximity()
      });
      state.abort?.abort();
      state.abort = new AbortController();
      const url = `https://api.mapbox.com/search/searchbox/v1/suggest?${params.toString()}`;
      const res = await fetch(url, { signal: state.abort.signal });
      if (!res.ok) throw new Error("Adresssuche nicht erreichbar.");
      const data = await res.json();
      return Array.isArray(data?.suggestions) ? data.suggestions : [];
    }

    async function fetchPickupLocationSuggestions(query) {
      return fetchLocationSuggestions("pickup", query);
    }

    async function selectLocationSuggestion(kind, suggestion) {
      const mapboxId = suggestion?.mapbox_id;
      const config = paxLocationSearchConfig[kind];
      if (!mapboxId) return setLocationSearchMessage(kind, "Vorschlag konnte nicht gelesen werden.");
      const input = document.getElementById(config.inputId);
      if (input) {
        input.value = getSuggestionLabel(suggestion);
        input.blur();
      }
      clearLocationSearchResults(kind);
      setLocationSearchMessage(kind, "Position wird übernommen...");
      try {
        const params = new URLSearchParams({
          access_token: CONFIG.mapboxToken,
          session_token: getLocationSearchSessionToken(kind)
        });
        const url = `https://api.mapbox.com/search/searchbox/v1/retrieve/${encodeURIComponent(mapboxId)}?${params.toString()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Adresse konnte nicht geladen werden.");
        const data = await res.json();
        const feature = Array.isArray(data?.features) ? data.features[0] : null;
        const location = normalizeLocationResult(feature, suggestion);
        if (!location) throw new Error("Adresse hat keine gültige Position.");
        if (config.apply(location)) {
          if (input) input.value = getLocationDisplayLabel(location);
          setLocationSearchMessage(kind, "aktiv");
          resetLocationSearchSession(kind);
        }
      } catch (err) {
        setLocationSearchMessage(kind, err?.message || "Adresse konnte nicht geladen werden.");
      }
    }

    async function selectPickupLocationSuggestion(suggestion) {
      return selectLocationSuggestion("pickup", suggestion);
    }

    function initPaxLocationSearch(kind) {
      const config = paxLocationSearchConfig[kind];
      const state = paxLocationSearchState[kind];
      const input = document.getElementById(config.inputId);
      if (!input) return;
      input.addEventListener("focus", () => {
        if (kind !== "target" || !paxTargetAddressResult || paxTargetSource === "address") return;
        const savedText = paxTargetAddressResult.address || paxTargetAddressResult.label || "";
        if (input.value.trim() === savedText.trim()) {
          reactivateStoredPaxTargetAddress();
          input.blur();
        }
      });
      input.addEventListener("input", () => {
        const query = input.value.trim();
        clearLocationSearchActiveUi(kind);
        clearTimeout(state.timer);
        if (!query) {
          state.abort?.abort();
          if (kind === "target") {
            clearPaxTargetAddressSelection();
          } else if (kind === "pickup") {
            clearPaxPickupAddressSelection();
          }
          updatePaxUI();
          return;
        }
        if (query.length < 3) {
          state.abort?.abort();
          clearLocationSearchResults(kind);
          setLocationSearchMessage(kind, query ? "Bitte mindestens 3 Zeichen eingeben." : "");
          return;
        }
        setLocationSearchMessage(kind, "Adresse wird gesucht...");
        state.timer = setTimeout(async () => {
          try {
            const suggestions = await fetchLocationSuggestions(kind, query);
            if (input.value.trim() !== query) return;
            renderLocationSearchResults(kind, suggestions);
            setLocationSearchMessage(kind, suggestions.length ? "" : "Keine passende Adresse gefunden.");
          } catch (err) {
            if (err?.name === "AbortError") return;
            clearLocationSearchResults(kind);
            setLocationSearchMessage(kind, err?.message || "Adresssuche braucht Internet.");
          }
        }, 260);
      });
      input.addEventListener("search", () => {
        if (!input.value.trim()) {
          state.abort?.abort();
          if (kind === "target") {
            clearPaxTargetAddressSelection();
            updatePaxUI();
            return;
          } else if (kind === "pickup") {
            clearPaxPickupAddressSelection();
            updatePaxUI();
            return;
          }
          clearLocationSearchResults(kind);
          setLocationSearchMessage(kind, "");
          resetLocationSearchSession(kind);
        }
      });
      input.addEventListener("blur", () => {
        window.setTimeout(() => {
          if (!document.activeElement?.closest?.(`#${config.rootId}`)) {
            clearLocationSearchResults(kind);
          }
        }, 160);
      });
    }

    function initPaxPickupLocationSearch() {
      initPaxLocationSearch("pickup");
    }

    function initPaxTargetLocationSearch() {
      initPaxLocationSearch("target");
    }

    function hasValidPaxPickup() {
      return paxLat !== null && paxLng !== null;
    }

    function hasConfirmedPaxPickupMap() {
      return paxPickupMapLat !== null && paxPickupMapLng !== null;
    }

    function hasValidPaxTarget() {
      return paxTargetLat !== null && paxTargetLng !== null;
    }

    function hasAnyPaxTargetState() {
      return !!paxTargetAddressResult
        || paxTargetSource === "address"
        || paxTargetSource === "map"
        || hasValidPaxTarget()
        || hasConfirmedPaxTargetMap()
        || hasPendingPaxTarget();
    }

    function hasConfirmedPaxTargetMap() {
      return paxTargetMapLat !== null && paxTargetMapLng !== null;
    }

    function isPaxSearchReady() {
      return hasValidPaxPickup() && hasValidPaxTarget() && isPaxDesiredTimeUsable();
    }

    function getPaxTargetUiState() {
      const hasTarget = hasValidPaxTarget();
      const hasPendingTarget = hasPendingPaxTarget();
      const hasActiveMapTarget = hasTarget && paxTargetSource === "map" && hasConfirmedPaxTargetMap();

      if (paxTargetMode) {
        return {
          headerText: "",
          headerClassName: "pax-acc-value",
          bodyText: "Ankunft auf Karte wählen",
          bodyClassName: "pax-status",
          buttonMainText: hasPendingTarget ? "Ziel fixieren" : "Ankunft auf Karte wählen",
          buttonSubText: hasPendingTarget ? "Position übernehmen" : "Position selbst auf Karte festlegen",
          mapActive: false,
          mapClearVisible: hasConfirmedPaxTargetMap()
        };
      }

      return {
        headerText: hasTarget ? "aktiv" : "",
        headerClassName: hasTarget ? "pax-acc-value set" : "pax-acc-value",
        bodyText: "",
        bodyClassName: hasTarget ? "pax-status set" : "pax-status",
        buttonMainText: hasActiveMapTarget ? "Ziel" : "Ankunft auf Karte wählen",
        buttonSubText: hasActiveMapTarget ? "aktiv" : "Position selbst auf Karte festlegen",
        mapActive: hasActiveMapTarget,
        mapClearVisible: false
      };
    }

    function getPaxPickupUiState() {
      const hasPickup = hasValidPaxPickup();
      const hasPendingPickup = hasPendingPaxPickup();
      const confirmedGps = hasPickup && paxPickupSource === "gps";
      const confirmedAddress = hasPickup && paxPickupSource === "address";
      const confirmedMap = hasPickup && paxPickupSource === "map";
      const isGps = confirmedGps && !paxMarkerMode;
      const isAddress = confirmedAddress && !paxMarkerMode;
      const isMap = confirmedMap && hasConfirmedPaxPickupMap() && !paxMarkerMode;

      if (paxMarkerMode) {
        return {
          hasPickup,
          headerText: hasPendingPickup ? "Treffpunkt fixieren" : "Treffpunkt auf Karte wählen",
          headerClassName: "pax-acc-value",
          bodyText: "Treffpunkt auf Karte wählen",
          bodyClassName: "pax-status",
          gpsActive: confirmedGps,
          gpsMainText: "GPS-Standort",
          gpsSubText: confirmedGps ? "aktiv" : "Aktuellen Standort verwenden",
          addressActive: confirmedAddress,
          mapActive: false,
          mapMainText: hasPendingPickup ? "Treffpunkt fixieren" : "Treffpunkt auf Karte wählen",
          mapSubText: hasPendingPickup ? "Position übernehmen" : "Position selbst auf Karte festlegen",
          mapClearVisible: hasConfirmedPaxPickupMap()
        };
      }

      return {
        hasPickup,
        headerText: hasPickup ? "aktiv" : "",
        headerClassName: hasPickup ? "pax-acc-value set" : "pax-acc-value",
        bodyText: "",
        bodyClassName: hasPickup ? "pax-status set" : "pax-status",
        gpsActive: isGps,
        gpsMainText: "GPS-Standort",
        gpsSubText: isGps ? "aktiv" : "Aktuellen Standort verwenden",
        addressActive: isAddress,
        mapActive: isMap,
        mapMainText: isMap ? "Treffpunkt" : "Treffpunkt auf Karte wählen",
        mapSubText: isMap ? "aktiv" : "Position selbst auf Karte festlegen",
        mapClearVisible: false
      };
    }

    function updatePaxUI() {
      const statusEl    = document.getElementById("paxMarkerStatus");
      const timeBlock    = document.getElementById("paxTimeBlock");
      const lockedHint   = document.getElementById("paxLockedHint");
      const hintEl       = document.getElementById("paxHint");
      const targetBlock  = document.getElementById("paxTargetBlock");
      const targetStatus = document.getElementById("paxTargetStatus");
      const btnTarget    = document.getElementById("btnPaxTarget");
      const targetAddressChoiceRow = document.getElementById("paxTargetAddressChoiceRow");
      const btnTargetAddressClear = document.getElementById("btnPaxTargetAddressClear");
      const targetMapChoiceRow = document.getElementById("paxTargetMapChoiceRow");
      const btnTargetClear = document.getElementById("btnPaxTargetClear");
      const searchBlock  = document.getElementById("paxSearchBlock");
      const searchBtn   = document.getElementById("btnPaxSearch");
      const cancelBtn   = document.getElementById("btnPaxCancel");
      if (!statusEl) return;

      const onCooldown = isPaxInputLocked();
      // Modi beenden sobald Suche aktiv oder Cooldown, bevor Texte/Klassen berechnet werden
      if (paxSearchActive || onCooldown) {
        exitPaxMarkerMode();
        exitPaxTargetMode();
        paxPickupEditOpen = false;
      }

      const hasMarker = hasValidPaxPickup();
      const hasTarget = hasValidPaxTarget();
      const targetReachable = hasMarker || hasAnyPaxTargetState();
      const hasTime   = true; // Startzeit ist mit Default "jetzt" immer gesetzt
      const pickupUi = getPaxPickupUiState();
      const targetUi = getPaxTargetUiState();
      const pickupEditPending = paxMarkerMode || hasPendingPaxPickup();
      const targetEditPending = paxTargetMode || hasPendingPaxTarget();
      const targetAddressActive = hasTarget && paxTargetSource === "address" && !!paxTargetAddressResult && !paxTargetMode;

      if (hasMarker || paxMarkerMode) {
        statusEl.textContent = pickupUi.bodyText;
        statusEl.className = pickupUi.bodyText ? pickupUi.bodyClassName : "pax-status";
        timeBlock.style.display = hasMarker ? "" : "none";
      } else {
        statusEl.textContent = "";
        statusEl.className = "pax-status";
        timeBlock.style.display = "none";
        if (searchBlock) searchBlock.style.display = "none";
        hintEl.textContent = "Abholpunkt setzen um Fahrer zu finden.";
      }

      // Ziel bleibt erreichbar, wenn bereits ein Target-State existiert.
      if (targetBlock) targetBlock.style.display = targetReachable ? "" : "none";

      // Zielstatus
      if (targetStatus) {
        targetStatus.textContent = targetUi.bodyText;
        targetStatus.className = targetUi.bodyText ? targetUi.bodyClassName : "pax-status";
      }

      // Ziel-Button: gesperrt bei aktiver Suche oder Cooldown
      if (btnTarget) {
        const btnTargetMain = btnTarget.querySelector(".pax-btn-main");
        const btnTargetSub = btnTarget.querySelector(".pax-btn-sub");
        btnTarget.disabled = paxSearchActive || onCooldown;
        btnTarget.classList.toggle("active-pax", paxTargetMode || (targetUi.mapActive && !targetEditPending));
        btnTarget.classList.toggle("target-active", targetUi.mapActive && !targetEditPending);
        btnTarget.classList.toggle("map-editing", paxTargetMode);
        if (btnTargetMain) btnTargetMain.textContent = targetUi.buttonMainText;
        if (btnTargetSub) btnTargetSub.textContent = targetUi.buttonSubText;
      }
      if (targetMapChoiceRow) targetMapChoiceRow.classList.toggle("show-clear", !!targetUi.mapClearVisible);
      if (btnTargetClear) btnTargetClear.hidden = !targetUi.mapClearVisible;

      // Suchblock: nur wenn Abholpunkt + Ziel gesetzt
      if (searchBlock) {
        searchBlock.style.display = (hasMarker && hasTarget) ? "" : "none";
      }

      // Hint-Text je nach Status
      if (!hasMarker) {
        hintEl.textContent = "Bitte zuerst Abholpunkt wählen.";
      } else if (pickupEditPending) {
        hintEl.textContent = "Treffpunkt fixieren, wenn die Position passt.";
      } else if (targetEditPending) {
        hintEl.textContent = "Ziel fixieren, wenn die Position passt.";
      } else if (hasMarker && !hasTarget) {
        hintEl.textContent = "Bitte zuerst Ziel wählen.";
      } else if (hasMarker && hasTarget && !isPaxDesiredTimeUsable() && !paxSearchActive) {
        hintEl.textContent = "Bitte gültige Startzeit eingeben.";
      } else if (isPaxSearchReady() && !paxSearchActive) {
        hintEl.textContent = "Fahrer finden, wenn alles passt.";
      } else if (paxSearchActive) {
        hintEl.textContent = "Suche aktiv – passende Fahrer sind hervorgehoben.";
      }

      // Zeitfeld synchronisieren
      syncPaxTimeInputUI();
      lockedHint.classList.toggle("show", paxSearchActive);

      // GPS + Marker-Buttons während Cooldown sperren
      const btnGps    = document.getElementById("btnPaxGps");
      const btnMarker = document.getElementById("btnPaxMarker");
      const pickupAddressChoiceRow = document.getElementById("paxPickupAddressChoiceRow");
      const btnPickupAddressClear = document.getElementById("btnPaxPickupAddressClear");
      const pickupMapChoiceRow = document.getElementById("paxPickupMapChoiceRow");
      const btnMarkerClear = document.getElementById("btnPaxMarkerClear");
      const pickupLocationInput = document.getElementById("paxPickupLocationInput");
      const targetLocationInput = document.getElementById("paxTargetLocationInput");
      if (pickupLocationInput) pickupLocationInput.disabled = paxSearchActive || onCooldown;
      if (targetLocationInput) targetLocationInput.disabled = paxSearchActive || onCooldown;
      if (!paxSearchActive && !onCooldown && document.activeElement !== pickupLocationInput && pickupUi.addressActive) {
        setLocationSearchActiveUi("pickup", paxPickupLabel || "Adresse");
      }
      if (!paxSearchActive && !onCooldown && document.activeElement !== targetLocationInput && targetAddressActive) {
        setLocationSearchActiveUi("target", getLocationDisplayLabel(paxTargetAddressResult));
      }
      if (pickupAddressChoiceRow) pickupAddressChoiceRow.classList.toggle("show-clear", !!pickupUi.addressActive);
      if (btnPickupAddressClear) btnPickupAddressClear.hidden = !pickupUi.addressActive;
      if (targetAddressChoiceRow) targetAddressChoiceRow.classList.toggle("show-clear", !!targetAddressActive);
      if (btnTargetAddressClear) btnTargetAddressClear.hidden = !targetAddressActive;
      if (btnGps) {
        const btnGpsMain = btnGps.querySelector(".pax-btn-main");
        const btnGpsSub = btnGps.querySelector(".pax-btn-sub");
        btnGps.disabled = paxSearchActive || onCooldown;
        btnGps.classList.toggle("active-pax", pickupUi.gpsActive);
        if (btnGpsMain) btnGpsMain.textContent = pickupUi.gpsMainText;
        if (btnGpsSub) btnGpsSub.textContent = pickupUi.gpsSubText;
      }
      if (btnMarker) {
        const btnMarkerMain = btnMarker.querySelector(".pax-btn-main");
        const btnMarkerSub = btnMarker.querySelector(".pax-btn-sub");
        btnMarker.disabled = paxSearchActive || onCooldown;
        btnMarker.classList.toggle("active-pax", pickupUi.mapActive);
        btnMarker.classList.toggle("map-editing", paxMarkerMode);
        if (btnMarkerMain) btnMarkerMain.textContent = pickupUi.mapMainText;
        if (btnMarkerSub) btnMarkerSub.textContent = pickupUi.mapSubText;
      }
      if (pickupMapChoiceRow) pickupMapChoiceRow.classList.toggle("show-clear", !!pickupUi.mapClearVisible);
      if (btnMarkerClear) btnMarkerClear.hidden = !pickupUi.mapClearVisible;

      // Such-Button folgt der Produktregel: Abholpunkt + Ziel + gueltige Startzeit
      const searchReady = isPaxSearchReady();
      const timeValid = isPaxDesiredTimeUsable();
      const searchBtnDisabledReasons = getPaxSearchButtonDisabledReasons({
        onCooldown,
        pickupEditPending,
        targetEditPending,
        searchReady,
        pickupValid: hasMarker,
        targetValid: hasTarget,
        timeValid
      });
      if (searchBtn) searchBtn.disabled = searchBtnDisabledReasons.length > 0;
      if (cancelBtn) cancelBtn.classList.toggle("show", paxSearchActive);

      // Draggability beider Marker synchron halten
      syncPaxMarkerDraggable();
      syncPaxTargetMarkerDraggable();

      // ── Editable-Accordion: Header-Werte + Body-Sichtbarkeit ──
      // Regel: Body offen wenn gerade aktiver Schritt; geschlossen wenn fertig.
      // Header IMMER klickbar (außer Suche aktiv) → öffnet/schließt Body ohne Markerfreigabe.

      const locked = paxSearchActive || onCooldown;

      // --- Block 1: Abholpunkt ---
      const b1val  = document.getElementById("paxAccVal1");
      const b1label = document.getElementById("paxAccLabel1");
      const b1body = document.getElementById("paxAccBody1");
      const b1hdr  = document.getElementById("paxAccHeader1");
      if (b1label) b1label.textContent = "Abholung";
      if (b1hdr) b1hdr.classList.toggle("pickup-empty", !hasMarker);
      if (b1val) {
        b1val.textContent = pickupUi.headerText;
        b1val.className = pickupUi.headerClassName;
      }
      if (b1body) {
        // Offen wenn: kein Marker gesetzt, Bearbeitung bewusst geöffnet, oder Verschiebemodus aktiv
        const b1open = !hasMarker || paxPickupEditOpen || paxMarkerMode;
        b1body.classList.toggle("pax-closed", !b1open);
      }
      if (b1hdr) b1hdr.classList.toggle("locked", locked);

      // --- Block 2: Startzeitfenster ---
      const b2block = document.getElementById("paxAccBlock2");
      const b2val   = document.getElementById("paxAccVal2");
      const b2body  = document.getElementById("paxTimeBlock");
      const b2hdr   = document.getElementById("paxAccHeader2");
      if (b2block) b2block.style.display = hasMarker ? "" : "none";
      if (b2val) {
        b2val.textContent = getPaxVisibleTime();
        b2val.className = "pax-acc-value set";
      }
      if (b2body) {
        // Offen wenn: Abholpunkt und Ziel gesetzt sind, oder manuell geöffnet.
        const b2open = hasMarker && ((hasTarget && !paxTimeTouched) || paxTimeOpen);
        b2body.classList.toggle("pax-closed", !b2open);
      }
      if (b2hdr) b2hdr.classList.toggle("locked", locked);

      // --- Block 3: Ziel ---
      const b3block = document.getElementById("paxAccBlock3");
      const b3val   = document.getElementById("paxAccVal3");
      const b3body  = document.getElementById("paxTargetBlock");
      const b3hdr   = document.getElementById("paxAccHeader3");
      if (b3block) b3block.style.display = targetReachable ? "" : "none";
      if (b3val) {
        b3val.textContent = targetUi.headerText;
        b3val.className = targetUi.headerClassName;
      }
      if (b3body) {
        // Offen wenn: kein Ziel gesetzt, Ziel-Modus aktiv, oder Nutzer den Zielbereich offen haelt.
        const b3open = targetReachable && (!hasTarget || paxTargetMode || paxTargetOpen);
        b3body.classList.toggle("pax-closed", !b3open);
      }
      if (b3hdr) b3hdr.classList.toggle("locked", locked);

      // --- Block 4: Such-Block ---
      const searchBlockEl = document.getElementById("paxSearchBlock");
      if (searchBlockEl) {
        searchBlockEl.style.display = (hasMarker && hasTarget) ? "" : "none";
      }
    }

    // ── Accordion-Header-Klick-Handler (einmal beim Start registrieren) ──
    function initAccordionHandlers() {
      // Header 1: Abholpunkt-Bearbeitung oeffnen/schliessen, ohne Marker freizugeben
      document.getElementById("paxAccHeader1")?.addEventListener("click", () => {
        if (paxSearchActive || Date.now() < paxCooldownUntil) return;
        if (paxMarkerMode) {
          exitPaxMarkerMode();
          paxPickupEditOpen = true;
          hideHint();
          updatePaxUI();
          return;
        }
        if (!hasValidPaxPickup()) return;
        paxPickupEditOpen = !paxPickupEditOpen;
        if (paxPickupEditOpen) {
          showHint("Abholpunkt-Bearbeitung geöffnet.");
        } else {
          hideHint();
        }
        updatePaxUI();
      });

      // Header 2: Startzeitfenster → paxTimeOpen togglen, aktueller Wert bleibt erhalten
      document.getElementById("paxAccHeader2")?.addEventListener("click", () => {
        if (paxSearchActive || Date.now() < paxCooldownUntil) return;
        paxTimeTouched = true;
        paxTimeOpen = !paxTimeOpen;
        updatePaxUI();
      });

      // Header 3: Ziel → Ziel-Modus aktivieren
      document.getElementById("paxAccHeader3")?.addEventListener("click", () => {
        if (paxSearchActive || Date.now() < paxCooldownUntil) return;
        if (!paxTargetMode) {
          if (hasValidPaxTarget()) {
            paxTargetOpen = !paxTargetOpen;
            hideHint();
          } else {
            beginPaxTargetMode();
            paxTargetOpen = true;
            const btn = document.getElementById("btnPaxTarget");
            if (btn) btn.classList.add("active-pax");
            showHint("Ziel auf der Karte wählen.");
          }
        } else if (hasPendingPaxTarget()) {
          confirmPaxPendingTarget();
          return;
        } else {
          exitPaxTargetMode();
          hideHint();
        }
        updatePaxUI();
      });
    }

    // clearManualOpen als No-Op erhalten (cancelPaxSearch ruft es auf)
    function clearManualOpen() {}

    // GPS-Standort → Marker setzen (aktiviert keinen Verschiebe-Modus)
    document.getElementById("btnPaxGps")?.addEventListener("click", () => {
      if (!navigator.geolocation) return showHint("GPS nicht verfügbar.");
      const keepPickupEditOpen = !hasValidPaxPickup() || paxPickupEditOpen || paxMarkerMode;
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { longitude: lng, latitude: lat } = pos.coords;
          paxHasGps = true;                    // GPS-Verifikation gesetzt
          exitPaxMarkerMode();               // Marker-Modus beenden (GPS = kein manueller Modus)
          paxPickupEditOpen = keepPickupEditOpen;
          clearPickupLocationSelection();
          setPaxMarkerPos(lng, lat, "gps");  // GPS bestaetigt den Abholpunkt direkt
          focusPaxPickupOnMap(lng, lat);
          updatePaxUI();              // Such-Button entsperren
        },
        err => showHint("GPS-Fehler: " + err.message)
      );
    });

    // Marker per Kartenklick setzen
    document.getElementById("btnPaxMarker")?.addEventListener("click", () => {
      if (paxMarkerMode) {
        confirmPaxPendingPickup();
        return;
      }
      // Marker-Modus aktivieren
      beginPaxMarkerMode();
      showHint("Treffpunkt auf der Karte wählen.");
      updatePaxUI(); // Draggability sofort aktivieren
    });

    document.getElementById("btnPaxMarkerClear")?.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      clearPaxPickupMapSelection();
    });

    document.getElementById("btnPaxPickupAddressClear")?.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      clearPaxPickupAddressSelection();
      updatePaxUI();
    });

    // ─────────────────────────────────────────────────
    // ZEITFENSTER: GPS-artiges HH:MM-Feld, intern bleibt paxTimeMin
    // ─────────────────────────────────────────────────
    const PAX_STEP_MIN  = 0;          // fruehester Wert: jetzt
    const PAX_STEP_MAX  = 23 * 60 + 59; // spaetester Wert: heute 23:59
    const PAX_TIME_PLACEHOLDER = "HH:MM";

    function padTimePart(value) {
      return String(value).padStart(2, "0");
    }

    function formatTimeOfDay(date) {
      return `${padTimePart(date.getHours())}:${padTimePart(date.getMinutes())}`;
    }

    function formatPaxTimeFromMinutes(min, now = new Date()) {
      const safeMin = Math.max(PAX_STEP_MIN, Math.min(PAX_STEP_MAX, Number(min) || 0));
      return formatTimeOfDay(new Date(now.getTime() + safeMin * 60_000));
    }

    function getPaxVisibleTime() {
      return paxTimeUserSet && paxDesiredTime ? paxDesiredTime : PAX_TIME_PLACEHOLDER;
    }

    function getMinutesUntilClockTime(value, now = new Date()) {
      const match = value.match(/^(\d{2}):(\d{2})$/);
      if (!match) return null;
      const h = Number(match[1]);
      const m = Number(match[2]);
      if (h < 0 || h > 23 || m < 0 || m > 59) return null;

      const base = new Date(now);
      base.setSeconds(0, 0);
      const target = new Date(base);
      target.setHours(h, m, 0, 0);
      let diffMin = Math.round((target.getTime() - base.getTime()) / 60_000);
      if (diffMin < 0) return null;
      return diffMin;
    }

    function isPaxDesiredTimeUsable() {
      if (!paxTimeUserSet) return true;
      const min = getMinutesUntilClockTime(paxDesiredTime || "");
      return min !== null && min >= PAX_STEP_MIN && min <= PAX_STEP_MAX;
    }

    function syncPaxTimeInputUI() {
      const input = document.getElementById("paxTimeInput");
      if (!input) return;
      input.disabled = paxSearchActive || isPaxInputLocked();
      if (document.activeElement !== input) {
        input.value = paxTimeUserSet && paxDesiredTime ? paxDesiredTime : "";
      }
    }

    function commitPaxTimeInput(showMessage = true) {
      const input = document.getElementById("paxTimeInput");
      if (!paxTimeUserSet) {
        paxTimeMin = 0;
        if (input) input.value = "";
        return true;
      }
      const rawValue = (input?.value || paxDesiredTime || "").trim();
      const nextMin = getMinutesUntilClockTime(rawValue);
      if (nextMin === null) {
        if (!paxDesiredTime) paxTimeUserSet = false;
        if (input) input.value = paxTimeUserSet && paxDesiredTime ? paxDesiredTime : "";
        updatePaxUI();
        if (showMessage) showHint("Bitte Uhrzeit als HH:MM eingeben.");
        return false;
      }
      if (nextMin < PAX_STEP_MIN || nextMin > PAX_STEP_MAX) {
        paxDesiredTime = rawValue;
        paxTimeUserSet = true;
        updatePaxUI();
        if (showMessage) showHint("Bitte eine noch bevorstehende Startzeit wählen.");
        return false;
      }
      paxDesiredTime = rawValue;
      paxTimeUserSet = true;
      paxTimeMin = nextMin;
      if (input) input.value = paxDesiredTime;
      updatePaxUI();
      return true;
    }

    const paxTimeInput = document.getElementById("paxTimeInput");
    if (paxTimeInput) {
      paxTimeInput.addEventListener("input", e => {
        const digits = e.target.value.replace(/[^0-9]/g, "").slice(0, 4);
        if (digits.length <= 2) e.target.value = digits;
        else e.target.value = `${digits.slice(0, 2)}:${digits.slice(2)}`;

        if (/^\d{2}:\d{2}$/.test(e.target.value)) {
          paxTimeUserSet = true;
          commitPaxTimeInput(true);
        }
      });
      paxTimeInput.addEventListener("blur", () => {
        if (!/^\d{2}:\d{2}$/.test(paxTimeInput.value)) {
          paxTimeInput.value = paxTimeUserSet && paxDesiredTime ? paxDesiredTime : "";
          updatePaxUI();
          return;
        }
        paxTimeUserSet = true;
        commitPaxTimeInput(true);
      });
    }

    // ─────────────────────────────────────────────────
    // MITFAHRER-SUCHE: MATCHING
    // ─────────────────────────────────────────────────

    // Haversine-Distanz in km
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2
              + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Prüft ob ein Fahrer grob in Richtung Zielgebiet fährt
    // (letzte 2 Routenpunkte → Richtungsvektor)
    // Prüft ob Fahrer grob in Richtung Zielmarker fährt (Dot-Produkt)
    function driverHeadsTowardTarget(driverKey) {
      if (paxTargetLat === null || paxTargetLng === null) return true;
      const wantDLng = paxTargetLng - paxLng;
      const wantDLat = paxTargetLat - paxLat;
      if (Math.abs(wantDLng) < 0.001 && Math.abs(wantDLat) < 0.001) return true;
      const pts = routePoints.get(driverKey);
      if (!pts || pts.length < 2) return true;
      const p1 = pts[pts.length - 2];
      const p2 = pts[pts.length - 1];
      const drivDLng = p2.lng - p1.lng;
      const drivDLat = p2.lat - p1.lat;
      if (Math.abs(drivDLng) < 0.00005 && Math.abs(drivDLat) < 0.00005) return true;
      return (wantDLng * drivDLng + wantDLat * drivDLat) >= 0;
    }

    // ─── Cooldown-Helfer ───
    function startPaxCooldown() {
      if (paxCooldownTimer) { clearInterval(paxCooldownTimer); paxCooldownTimer = null; }
      paxCooldownUntil = Date.now() + PAX_COOLDOWN_MS;
      const statusEl = document.getElementById("paxMatchStatus");
      paxCooldownTimer = setInterval(() => {
        const remaining = Math.ceil((paxCooldownUntil - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(paxCooldownTimer);
          paxCooldownTimer = null;
          // Cooldown abgelaufen → UI entsperren
          updatePaxUI();
          if (statusEl && statusEl.classList.contains("cooldown")) {
            statusEl.className = "pax-match-status";
            statusEl.textContent = "";
          }
        } else {
          if (statusEl) {
            statusEl.textContent = `Bitte kurz warten… noch ${remaining}s`;
            statusEl.className = "pax-match-status show cooldown";
          }
          updatePaxUI(); // Button+Zeitfenster gesperrt halten
        }
      }, 500);
    }

    function isPaxRateLimited() {
      const now = Date.now();
      // Alte Einträge außerhalb des Zeitfensters bereinigen
      while (paxStartTimes.length && now - paxStartTimes[0] > PAX_MAX_WINDOW_MS) {
        paxStartTimes.shift();
      }
      // Bereits >= MAX_STARTS im Fenster → gesperrt
      return paxStartTimes.length >= PAX_MAX_STARTS;
    }

    function runPaxSearch() {
      const inputLocked = isPaxInputLocked();
      if (!map || paxLat === null || paxLng === null) return;
      if (paxTargetLat === null || paxTargetLng === null) return;
      if (inputLocked) return;
      if (!commitPaxTimeInput(true)) return;

      if (isPaxRateLimited()) {
        const statusEl = document.getElementById("paxMatchStatus");
        if (statusEl) { statusEl.textContent = "Zu viele Neustarts – bitte kurz warten."; statusEl.className = "pax-match-status show cooldown"; }
        startPaxCooldown();
        return;
      }

      paxStartTimes.push(Date.now());
      paxMatchedKeys.clear();

      // Eskalierender Radius: 2 → 4 → 6 → 8 → 10 km
      // Stop beim ersten Radius mit ≥ 1 Treffer
      let hits = [];
      let foundAtKm = null;
      const now = Date.now();

      for (const radiusKm of PAX_MATCH_RADII_KM) {
        const candidates = [];
        for (const [driverKey, pos] of positions.entries()) {
          if (endedDrivers.has(driverKey)) continue;
          if (!hasPublicRideForDriver(driverKey)) continue;
          const ageMs = now - (pos.ts || 0);
          if (ageMs > RIDE_FRESH_MS) continue;
          const distKm = haversineKm(paxLat, paxLng, pos.lat, pos.lng);
          if (distKm > radiusKm) continue;
          if (!driverHeadsTowardTarget(driverKey)) continue;
          candidates.push({ driverKey, pos, distKm });
        }
        if (candidates.length > 0) {
          hits = candidates;
          foundAtKm = radiusKm;
          break;
        }
      }

      // Sortierung: nächster zuerst
      hits.sort((a, b) => a.distKm - b.distKm);
      for (const { driverKey } of hits) paxMatchedKeys.add(driverKey);

      paxSearchActive = true;
      refreshPaxMatchLayer();
      let statusEl = null;
      let listEl = null;
      updatePaxUI();
      updatePanelSearchStatus();

      // Status-Zeile
      statusEl = document.getElementById("paxMatchStatus");
      if (statusEl) {
        if (hits.length > 0) {
          statusEl.textContent = `${hits.length} Fahrer gefunden (${foundAtKm} km Umkreis) ✅`;
          statusEl.className = "pax-match-status show found";
        } else {
          statusEl.textContent = "Keine passenden Fahrer in 10 km Umkreis.";
          statusEl.className = "pax-match-status show none";
        }
      }

      // Trefferliste rendern
      listEl = document.getElementById("paxResultList");
      if (listEl) {
        listEl.innerHTML = "";
        if (hits.length > 0) {
          listEl.style.display = "flex";
          for (const { driverKey, pos, distKm } of hits) {
            const distText = distKm < 1
              ? `${Math.round(distKm * 1000)} m`
              : `${distKm.toFixed(1)} km`;
            const ride = getPublicRideForDriver(driverKey);
            const seats = Number(ride?.plaetze);
            const seatText = Number.isFinite(seats) && seats > 0 ? `${seats} Platz/Plätze` : null;
            const priceText = formatSeatPrice(ride?.preis);
            const item = document.createElement("div");
            item.className = "pax-result-item";
            item.dataset.driverKey = driverKey;
            const name = document.createElement("div");
            name.className = "pax-result-name";
            name.textContent = ride?.fahrer_name || pos.driver_id || driverKey;
            const meta = document.createElement("div");
            meta.className = "pax-result-meta";
            [distText, seatText, priceText].filter(Boolean).forEach((text) => {
              const pill = document.createElement("span");
              pill.className = "pax-result-pill";
              pill.textContent = text;
              meta.appendChild(pill);
            });
            const cta = document.createElement("span");
            cta.className = "pax-result-cta";
            cta.textContent = "Fahrt ansehen";
            item.appendChild(name);
            item.appendChild(meta);
            item.appendChild(cta);
            const snapLng = pos.lng;
            const snapLat = pos.lat;
            item.addEventListener("click", () => {
              map.easeTo({ center: [snapLng, snapLat], zoom: 15, duration: 500 });
            });
            listEl.appendChild(item);
          }
        } else {
          listEl.style.display = "none";
        }
      }
    }

    function cancelPaxSearch() {
      paxSearchActive = false;
      paxTimeOpen = false;
      paxTimeTouched = false;
      paxMatchedKeys.clear();
      clearManualOpen();
      refreshPaxMatchLayer();
      updatePaxUI();
      updatePanelSearchStatus();
      const statusEl = document.getElementById("paxMatchStatus");
      if (statusEl) { statusEl.textContent = ""; statusEl.className = "pax-match-status"; }
      const listEl = document.getElementById("paxResultList");
      if (listEl) { listEl.innerHTML = ""; listEl.style.display = "none"; }
      // Cooldown NUR hier starten – Eingabephase (Zeitfenster, Zieltext) bleibt frei
      startPaxCooldown();
    }

    function handleObservedRideEnded(driverKey) {
      const key = normId(driverKey);
      if (!key || !paxSearchActive || !paxMatchedKeys.has(key)) return false;

      paxMatchedKeys.delete(key);
      const listEl = document.getElementById("paxResultList");
      if (listEl) {
        for (const item of listEl.querySelectorAll(".pax-result-item")) {
          if (item.dataset.driverKey === key) item.remove();
        }
        listEl.style.display = paxMatchedKeys.size > 0 ? "flex" : "none";
      }

      if (paxMatchedKeys.size === 0) {
        paxSearchActive = false;
        updatePaxUI();
      }
      refreshPaxMatchLayer();
      updatePanelSearchStatus();

      const statusEl = document.getElementById("paxMatchStatus");
      if (statusEl) {
        statusEl.textContent = paxMatchedKeys.size > 0
          ? `Eine beobachtete Fahrt wurde beendet. ${paxMatchedKeys.size} weitere verfügbar.`
          : "Die beobachtete Fahrt wurde beendet. Du kannst erneut suchen.";
        statusEl.className = "pax-match-status show none";
      }
      return true;
    }

    // Highlight-Layer auf der Karte aktualisieren
    function refreshPaxMatchLayer() {
      const source = map?.getSource?.(PAX_MATCH_SOURCE);
      if (!map || !source) return;
      const features = [];
      if (paxSearchActive) {
        for (const [driverKey, pos] of positions.entries()) {
          if (!paxMatchedKeys.has(driverKey)) continue;
          features.push({
            type: "Feature",
            properties: { driverKey },
            geometry: { type: "Point", coordinates: [pos.lng, pos.lat] }
          });
        }
      }
      source.setData({ type: "FeatureCollection", features });
    }

    // Such-Buttons
    document.getElementById("btnPaxSearch")?.addEventListener("click", () => runPaxSearch());
    document.getElementById("btnPaxCancel")?.addEventListener("click", () => cancelPaxSearch());

    // ─────────────────────────────────────────────────
    // UTILS
    // ─────────────────────────────────────────────────
    function debounce(fn, waitMs) {
      let t = null;
      return (...args) => { if (t) clearTimeout(t); t = setTimeout(() => fn(...args), waitMs); };
    }
    function normalizeCutoff(cutoffOverride, fallbackIso) {
      if (!cutoffOverride) return fallbackIso;
      if (typeof cutoffOverride === "number") return new Date(cutoffOverride).toISOString();
      return String(cutoffOverride);
    }
    function normId(v) { return String(v ?? "").trim().toLowerCase(); }
    function setPanelStatusText(text) {
      const status = document.getElementById("panelStatusText");
      if (status) status.textContent = text || "";
    }
    function setPanelIdleTitle() {
      const status = document.getElementById("panelStatusText");
      if (!status) return;
      status.textContent = "EcoRide";
    }
    function updatePanelSearchStatus() {
      if (!paxSearchActive) {
        setPanelIdleTitle();
      } else if (paxMatchedKeys.size > 0) {
        setPanelStatusText("Fahrer gefunden");
      } else {
        setPanelStatusText("Fahrer werden gesucht");
      }
    }
    function getColorForDriver(driverKey) {
      let hash = 0;
      for (let i = 0; i < driverKey.length; i++) hash = driverKey.charCodeAt(i) + ((hash << 5) - hash);
      return ROUTE_COLORS[Math.abs(hash) % ROUTE_COLORS.length];
    }
    function isPanelOpen() {
      const p = document.querySelector(".panel");
      return p && !p.classList.contains("collapsed");
    }
    function isTabVisible() { return document.visibilityState === "visible"; }
    function shouldPollImpact() { return isPanelOpen() && isTabVisible(); }
    function showHint(msg) {
      if (!isPanelOpen()) return;
      const el = document.getElementById("hintInline");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
    }
    function hideHint() {
      const el = document.getElementById("hintInline");
      if (!el) return;
      el.classList.remove("show");
      el.textContent = "";
    }
    function setRealtimeState(state) {
      const dot = document.getElementById("rtDot");
      const txt = document.getElementById("rtTxt");
      if (dot) dot.classList.toggle("on", state === "AN");

    function formatAge(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      if (s < 60) return `vor ${s} Sek.`;
      const m = Math.floor(s / 60);
      if (m < 60) return `vor ${m} Min.`;
      const h = Math.floor(m / 60);
      if (h < 48) return `vor ${h} Std.`;
      return `vor ${Math.floor(h / 24)} Tg.`;
    }
    async function copyText(text) {
      try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (_) {}
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(ta); ta.focus(); ta.select();

    function isValidLatLng(lat, lng) {
      return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
    }

    function getDriverRideRouteCoords(driverKey) {
      if (!driverKey) return null;
      let bestRide = null;
      let bestTs = 0;
      for (const ride of activeRides.values()) {
        if (normId(ride?.driver_id) !== driverKey) continue;
        const rideTs = new Date(ride?.updated_at || ride?.erstellt_am || ride?.departure_time || 0).getTime() || 0;
        if (!bestRide || rideTs >= bestTs) {
          bestRide = ride;
          bestTs = rideTs;
        }
      }
      if (!bestRide) return null;

      try {
        const raw = bestRide.route_punkte;
        if (Array.isArray(raw) && raw.length >= 2) {
          const pts = raw
            .map(p => [Number(p?.lng ?? p?.lon ?? p?.[0]), Number(p?.lat ?? p?.[1])])
            .filter(([lng, lat]) => isValidLatLng(lat, lng));
          if (pts.length >= 2) return pts;
        }
      } catch (_) {}

      const fLat = Number(bestRide.fahrer_lat);
      const fLng = Number(bestRide.fahrer_lng);
      const zLat = Number(bestRide.ziel_lat);
      const zLng = Number(bestRide.ziel_lng);
      if (isValidLatLng(fLat, fLng) && isValidLatLng(zLat, zLng)) {
        return [[fLng, fLat], [zLng, zLat]];
      }
      return null;
    }

      if (!map || !map.getSource("er-selected-route")) return;
      const hasRoute = routesVisible

        && Array.isArray(selectedRouteCoords)

      const features = hasRoute ? [{

        geometry: { type: "LineString", coordinates: selectedRouteCoords }
      }] : [];
      map.getSource("er-selected-route").setData({ type: "FeatureCollection", features });
    }

    function persistSelectedDriverRoute(driverKey, routeCoords) {
      if (!driverKey || !Array.isArray(routeCoords) || routeCoords.length < 2) return false;
      selectedRouteDriverKey = driverKey;

    function showDriverRouteOnMap(driverKey, routeCoords) {
      if (!map || !driverKey || !Array.isArray(routeCoords) || routeCoords.length < 2) return false;

      routePoints.set(driverKey, routeCoords.map(([lng, lat], idx) => ({ lng, lat, ts: now + idx })));
      persistSelectedDriverRoute(driverKey, routeCoords);
      refreshRoutesSource();
      const bounds = routeCoords.reduce(

      map.fitBounds(bounds, { padding: 80, duration: 550, maxZoom: 14 });

    function getBoundsBBoxPadded() {
      if (!map) return null;
      const b = map.getBounds();
      if (!b) return null;
      const w = b.getWest(), s = b.getSouth(), e = b.getEast(), n = b.getNorth();
      const dx = (e - w) * BBOX_PAD_FACTOR, dy = (n - s) * BBOX_PAD_FACTOR;
      return { west: w - dx, south: s - dy, east: e + dx, north: n + dy };
    }
    function isInBbox(bb, lng, lat) {
      if (!bb) return true;
      return lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
    }

    function refreshDriversSource(reason = "unknown") {
      if (!map || !map.getSource(DRIVERS_SOURCE)) return;
      const feats = [];
      const now = Date.now();
      logMapPath("refreshDriversSource:start", { positionsSize: positions.size, currentFilterKey, activeOnlyMode, activeRidesSize: activeRides.size, endedDriversSize: endedDrivers.size });
      for (const [driverKey, p] of positions.entries()) {
        if (!p) {
          logMapPath("refreshDriversSource:skip", { driverKey, reason: "missing-position" });
          continue;
        }
        if (endedDrivers.has(driverKey)) {
          logMapPath("refreshDriversSource:skip", { driverKey, reason: "ended-driver" });
          continue;
        }
        if (currentFilterKey && driverKey !== currentFilterKey) {
          logMapPath("refreshDriversSource:skip", { driverKey, reason: "filter-mismatch", currentFilterKey });
          continue;
        }
        if (!hasPublicRideForDriver(driverKey)) {
          logMapPath("refreshDriversSource:skip", { driverKey, reason: "without-public-ride" });
          continue;
        }
        // Bug 3: Aktive-Modus = nur Fahrer mit aktiver Fahrt in activeRides
        if (activeOnlyMode && !currentFilterKey) {
          const hasRide = [...activeRides.values()].some(r => normId(r.driver_id) === driverKey);
          if (!hasRide) {
            logMapPath("refreshDriversSource:skip", { driverKey, reason: "active-only-without-ride" });
            continue;
          }
        }
        const state = getDriverRouteState(driverKey);
        if (state === "hidden") continue;
        const ageMs = (now - (p.ts || now));
        const stale = state === "stale";
        const pulsePhase = ((Date.now() % 1200) / 1200);
        const pulseScale = stale ? 0 : pulsePhase;
        const pulseOpacity = stale ? 0 : (0.22 + (0.22 * (1 - pulsePhase)));
        logMapPath("refreshDriversSource:keep", { driverKey, rawId: p.rawId, lat: p.lat, lng: p.lng, ts: p.ts, ageMs, stale, state });
        feats.push({
          type: "Feature",
          properties: { driverKey, rawId: p.rawId, ts: p.ts, stale: stale ? 1 : 0, isLive: stale ? 0 : 1, pulseScale, pulseOpacity },
          geometry: { type: "Point", coordinates: [p.lng, p.lat] }
        });
      }
      applyDefaultDriverLayerFilters();
      logMapPath("refreshDriversSource:before-setData", { markerFeatures: feats.length, sourceFeatureCountBefore: getDriverSourceFeatureCount() });
      setDriversSourceData({ type: "FeatureCollection", features: feats });
      logMapPath("refreshDriversSource:after-setData", { markerFeatures: feats.length, sourceFeatureCountAfter: getDriverSourceFeatureCount() });
      updateSelectedLayerFilter();
      setCount(feats.length);
      setSafeTextContent("impactMarkers", String(feats.length));
      pulse("impactMarkers");
      // Mitfahrer-Suche: Highlight nach Positions-Update synchron halten
      if (paxSearchActive) refreshPaxMatchLayer();
    }

    // ─────────────────────────────────────────────────
    // NEU: RIDES SOURCE (Ziel-Punkte + Routen-Linien)
    // ─────────────────────────────────────────────────
    function refreshRidesSource() {
      if (!map || !map.getSource(RIDES_SOURCE)) return;

      const destFeatures  = [];
      const routeFeatures = [];
      const canonicalRideByDriver = new Map();

      for (const [rideId, ride] of activeRides.entries()) {
        const driverKey = normId(ride.driver_id);
        if (!driverKey) continue;
        const isOfferedRide = ride?.status === "angeboten";
        const routeState = isOfferedRide ? "planned" : getDriverRouteState(driverKey);
        const candidateTs = new Date(ride.updated_at || ride.erstellt_am || ride.departure_time || 0).getTime() || 0;
        const prev = canonicalRideByDriver.get(driverKey);
        const rank = routeState === "active" ? 3 : routeState === "stale" ? 2 : routeState === "planned" ? 1 : 0;
        if (!prev) {
          canonicalRideByDriver.set(driverKey, { rideId, ride, routeState, rank, candidateTs });
          continue;
        }
        if (rank > prev.rank) {
          canonicalRideByDriver.set(driverKey, { rideId, ride, routeState, rank, candidateTs });
          continue;
        }
        if (rank === prev.rank && candidateTs > prev.candidateTs) {
          canonicalRideByDriver.set(driverKey, { rideId, ride, routeState, rank, candidateTs });
        }
      }

      for (const { rideId, ride, routeState } of canonicalRideByDriver.values()) {
        const zLat = Number(ride.ziel_lat), zLng = Number(ride.ziel_lng);
        if (!isValidLatLng(zLat, zLng)) continue;

        const props = {
          rideId,
          driverId:   ride.driver_id || "",
          fahrerName: ride.fahrer_name || ride.driver_id || "",
          plaetze:    ride.plaetze ?? 2,
          preis:      Number(ride.preis ?? 0),
          bewertung:  ride.fahrer_bewertung !== null && ride.fahrer_bewertung !== undefined
                        ? Number(ride.fahrer_bewertung) : null,
          fahrerLat:  Number(ride.fahrer_lat),
          fahrerLng:  Number(ride.fahrer_lng),
        };

        // ── Ziel-Punkt (orange) ──
        if (routeState !== "hidden") {
          destFeatures.push({
            type: "Feature",
            properties: { ...props, stale: routeState === "stale" ? 1 : 0, rideStatus: ride.status || "aktiv" },
            geometry: { type: "Point", coordinates: [zLng, zLat] }
          });
        }

        // ── Routen-Linie: route_punkte (JSONB) oder Fallback Start→Ziel ──
        let coords = null;
        try {
          const raw = ride.route_punkte;
          if (Array.isArray(raw) && raw.length >= 2) {
            const pts = raw
              .map(p => [Number(p.lng ?? p.lon ?? p[0]), Number(p.lat ?? p[1])])
              .filter(([lng, lat]) => isValidLatLng(lat, lng));
            if (pts.length >= 2) coords = pts;
          }
        } catch (_) {}

        // Fallback: Fahrer-Startposition → Ziel (2 Punkte)
        if (!coords) {
          const fLat = Number(ride.fahrer_lat), fLng = Number(ride.fahrer_lng);
          if (isValidLatLng(fLat, fLng)) {
            coords = [[fLng, fLat], [zLng, zLat]];
          }
        }

        if (coords && coords.length >= 2) {
          routeFeatures.push({
            type: "Feature",
            properties: {
              rideId,
              driverId: ride.driver_id || "",
              route_state: routeState,
              stale: routeState === "stale" ? 1 : 0,
              color: routeState === "active" ? "#B7D532" : routeState === "planned" ? "#f59e0b" : "#6B7A8F"
            },
            geometry: { type: "LineString", coordinates: coords }
          });
        }
      }

      map.getSource(RIDES_SOURCE).setData({ type: "FeatureCollection", features: destFeatures });

      if (map.getSource(RIDES_ROUTE_SOURCE)) {
        map.getSource(RIDES_ROUTE_SOURCE).setData({ type: "FeatureCollection", features: routeFeatures });
      }

      setSafeTextContent("rideCountTxt", String(destFeatures.length));
      pulse("rideCountTxt");
    }

        refreshDriversSource("marker-popup-route");
        onVisibilityOrPanelChange();
      });
      const coords = feature.geometry?.coordinates;

      markerPopup = new mapboxgl.Popup({ closeButton: true, closeOnClick: true, offset: 14 })
