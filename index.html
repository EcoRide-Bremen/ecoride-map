<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide – Live-Karte</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root {
      --bg:#0b0f14;
      --text:#eaf0ff;
      --fg:#eaf0ff;
      --muted:#9aa9c3;
      --sheet-bg: rgba(14, 19, 30, 0.97);
      --handle-bg: rgba(255,255,255,0.18);
      --panelA: rgba(17,24,37,0.45);
      --panelB: rgba(14,19,30,0.38);
      --line: rgba(255,255,255,0.10);
      --accent: #c7df3a;
      --accentText:#0b0f14;
      --ink: #eaf0ff;
    }
    body.theme-light {
      --bg: #eef3fb;
      --text: #111827;
      --fg: #111827;
      --muted: rgba(17,24,39,0.72);
      --sheet-bg: rgba(255, 255, 255, 0.96);
      --handle-bg: rgba(15,23,42,0.18);
      --line: rgba(15,23,42,0.10);
      --ink: #111827;
    }
    html, body { height:100%; margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #map { position:absolute; inset:0; }

    .panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      z-index: 10;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .panel-shell {
      width: 100%;
      height: 58vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--sheet-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 10px 12px 16px;
      box-sizing: border-box;
      pointer-events: auto;
      transition: height .28s ease;
      will-change: height;
      touch-action: auto;
      box-shadow: 0 -12px 32px rgba(0,0,0,0.22);
    }
    .panel.panel-half .panel-shell { height: 58vh; }
    .panel.panel-mid .panel-shell { height: 30vh; }
    .panel.collapsed .panel-shell { height: 10vh; padding-bottom: 10px; }

    .title {
      flex-shrink: 0;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      padding: 2px 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }
    .panel-handle {
      width: 48px;
      height: 5px;
      border-radius: 999px;
      background: var(--handle-bg);
      display: block;
      flex-shrink: 0;
      cursor: grab;
      touch-action: none;
    }
    .title-text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      text-align: center;
      line-height: 1.2;
    }
    .panel:not(.collapsed) .title-text { display: none; }
    .panel.collapsed .title {
      flex: 1;
      display: grid;
      grid-template-rows: 5px minmax(0, 1fr);
      align-items: stretch;
      align-content: center;
      gap: 8px;
      padding: 0;
    }
    .panel.collapsed .panel-handle {
      justify-self: center;
    }
    .panel.collapsed .title-text {
      align-self: center;
      justify-self: center;
      font-size: 21px;
      line-height: 1.2;
    }
    .panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    .panel-body::-webkit-scrollbar { width: 3px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(199,223,58,0.25); border-radius: 999px; }
    /* ── Floating Theme-Toggle – Icon only, maximalistisch minimal ── */
    .map-overlay-icon {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 15;
      border: none;
      background: none;
      box-shadow: none;
      color: var(--fg);
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      padding: 8px;
      opacity: 0.8;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.2s ease;
    }
    .map-overlay-icon:active { opacity: 0.5; }

    .row {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
      width:100%;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .panel.collapsed .row,
    .panel.collapsed .stat,
    .panel.collapsed .stat2,
    .panel.collapsed .stat3,
    .panel.collapsed .stat4,
    .panel.collapsed .panel-body,
    .panel.collapsed .mode-panel { display:none !important; }

    /* ── Mode-Panels ── */
    .mode-panel { margin-top: 8px; min-height: 0; }

    /* ── Mitfahrer-Panel ── */
    .pax-brand-title {
      padding: 2px 16px 3px;
      font-family: inherit;
      font-size: 21px;
      font-weight: 750;
      text-align: center;
      color: var(--ink);
      line-height: 1.12;
    }
    .pax-flow-title {
      padding: 1px 16px 8px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      color: var(--ink);
    }

    /* ── Fahrtwunsch-Karten: ganze Flaeche ist Touch-Ziel ── */
    .pax-acc-block {
      margin: 8px 16px 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(17,24,37,0.46);
      overflow: hidden;
    }
    .pax-flow-title + .pax-acc-block { margin-top: 6px; }
    .pax-acc-block + .pax-acc-block { margin-top: 14px; }
    body.theme-light .pax-acc-block {
      background: rgba(255,255,255,0.82);
      border-color: rgba(15,23,42,0.10);
    }

    /* Header: immer sichtbar, gesamte Karte klickbar zum Auf-/Zuklappen */
    .pax-acc-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 62px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
      width: 100%;
    }
    .pax-acc-header:active { opacity: 0.75; }
    /* Sperren wenn Suche aktiv */
    .pax-acc-header.locked { cursor: default; opacity: 0.6; pointer-events: none; }
    .pax-acc-header.pickup-empty .pax-acc-edit { display: none; }

    .pax-acc-label {
      grid-column: 1;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--ink);
      min-width: 0;
    }
    #paxAccLabel1,
    #paxAccBlock3 .pax-acc-label,
    #paxAccBlock2 .pax-acc-label {
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }
    #paxAccHeader1,
    #paxAccHeader3,
    #paxAccHeader2 {
      padding-bottom: 3px;
      row-gap: 2px;
    }
    #paxAccHeader1 .pax-acc-edit,
    #paxAccHeader3 .pax-acc-edit,
    #paxAccHeader2 .pax-acc-edit {
      grid-row: 1;
      align-self: center;
    }
    .pax-acc-value {
      grid-column: 1;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pax-acc-value.set { color: #4ade80; }
    #paxAccHeader1 .pax-acc-value.set,
    #paxAccHeader3 .pax-acc-value.set,
    #paxAccHeader2 .pax-acc-value.set {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }
    .pax-acc-edit {
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 32px;
      height: 32px;
      color: rgba(199,223,58,0.72);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color .15s;
    }
    .pax-acc-header:not(.locked):hover .pax-acc-edit { color: rgba(199,223,58,0.95); }
    .pax-map-icon svg,
    .pax-time-icon svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Body: collapsible */
    .pax-acc-body {
      overflow: hidden;
      transition: max-height 0.28s ease, opacity 0.22s ease;
      max-height: 300px;
      opacity: 1;
    }
    #paxAccBlock1 .pax-acc-body:not(.pax-closed) { max-height: 340px; }
    .pax-acc-body.pax-closed {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .pax-acc-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 2px 14px 16px;
      box-sizing: border-box;
    }

    /* ── Komprimierte Block-Abstände ── */
    .pax-block {
      padding: 4px 10px 0;
      box-sizing: border-box;
      width: 100%;
    }
    .pax-block-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      opacity: 0.40;
      margin-bottom: 4px;
    }
    /* Daumenfreundliche Buttons nach GPS-Client-Groessenhierarchie */
    .pax-btn {
      width: 100%;
      box-sizing: border-box;
      min-height: 44px;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(199,223,58,0.25);
      background: rgba(17,24,37,0.28);
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      text-align: center;
    }
    .pax-btn.active-pax {
      background: rgba(199,223,58,0.85);
      color: #0b0f14;
      border-color: transparent;
    }
    .pax-pickup-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pax-acc-inner > .pax-location-search,
    .pax-address-choice-row > .pax-location-search {
      margin: 0;
    }
    .pax-choice-btn {
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 60px;
      align-items: center;
      gap: 5px;
      margin-bottom: 0;
      padding: 10px 18px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.07);
      color: var(--ink);
      box-shadow: 0 0 0 rgba(255,255,255,0);
      outline: none;
    }
    #btnPaxGps,
    #btnPaxMarker,
    #btnPaxTarget {
      min-height: 60px;
      padding: 10px 18px;
      margin-bottom: 0;
    }
    .pax-map-choice-row,
    .pax-address-choice-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: stretch;
      width: 100%;
      min-width: 0;
    }
    .pax-map-choice-row.show-clear,
    .pax-address-choice-row.show-clear {
      grid-template-columns: minmax(0, 1fr) 44px;
    }
    .pax-map-clear-btn {
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 60px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,0.34);
      background: rgba(239,68,68,0.10);
      color: #f87171;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      box-sizing: border-box;
      outline: none;
    }
    .pax-map-choice-row.show-clear .pax-map-clear-btn,
    .pax-address-choice-row.show-clear .pax-map-clear-btn {
      display: flex;
    }
    .pax-map-clear-btn[hidden] {
      display: none !important;
    }
    body.theme-light .pax-map-clear-btn {
      background: rgba(239,68,68,0.08);
      color: #b91c1c;
      border-color: rgba(239,68,68,0.28);
    }
    .pax-choice-btn.active-pax {
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      border-color: rgba(199,223,58,0.34);
    }
    .pax-choice-btn:focus,
    .pax-choice-btn:focus-visible {
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      outline: none;
    }
    .pax-choice-btn:active {
      opacity: 1;
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      border-color: rgba(255,255,255,0.92);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.16), 0 0 18px rgba(255,255,255,0.18) !important;
      filter: none;
      transform: none;
    }
    .pax-btn-main {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }
    .pax-btn-sub {
      display: block;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      color: rgba(229,231,235,0.66);
    }
    .pax-btn.active-pax .pax-btn-sub { color: rgba(11,15,20,0.70); }
    .pax-choice-btn.active-pax .pax-btn-main { color: var(--ink); }
    .pax-choice-btn.active-pax .pax-btn-sub {
      color: #4ade80;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      margin-top: -3px;
    }
    .pax-choice-separator {
      align-self: center;
      margin: -4px 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      opacity: .58;
    }
    .pax-location-search {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 14px 0;
      width: 100%;
      inline-size: 100%;
      max-inline-size: none;
      min-inline-size: 0;
      align-self: stretch;
      box-sizing: border-box;
    }
    .pax-location-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
    }
    .pax-location-input {
      width: 100%;
      inline-size: 100%;
      max-inline-size: none;
      min-inline-size: 0;
      box-sizing: border-box;
      min-height: 60px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      color: var(--ink);
      padding: 16px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      outline: none;
    }
    .pax-location-input::placeholder {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      opacity: 1;
    }
    .pax-location-input:not(:placeholder-shown)::placeholder {
      color: transparent;
      opacity: 0;
    }
    .pax-location-input:focus::placeholder {
      color: transparent;
      opacity: 0;
    }
    .pax-location-input::-webkit-search-cancel-button,
    .pax-location-input::-webkit-search-decoration {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }
    .pax-location-input:focus { border-color: rgba(199,223,58,0.42); }
    .pax-location-results {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      inline-size: 100%;
      max-inline-size: none;
      min-inline-size: 0;
      box-sizing: border-box;
    }
    .pax-location-results.show { display: flex; }
    .pax-location-result {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      inline-size: 100%;
      max-inline-size: none;
      min-inline-size: 0;
      box-sizing: border-box;
      min-height: 58px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(17,24,37,0.36);
      color: var(--ink);
      padding: 13px 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .pax-location-result-main {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }
    .pax-location-result-sub {
      font-size: 12.5px;
      line-height: 1.25;
      color: var(--muted);
    }
    .pax-location-message {
      min-height: 16px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      text-align: center;
    }
    .pax-location-message:empty {
      display: none;
    }
    .pax-location-search.location-active {
      gap: 5px;
      min-height: 60px;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      border: 1px solid rgba(199,223,58,0.34);
      background: rgba(255,255,255,0.04);
      padding: 10px 18px;
      text-align: center;
    }
    .pax-location-search.location-active .pax-location-label,
    .pax-location-search.location-active .pax-location-results {
      display: none;
    }
    .pax-location-search.location-active .pax-location-input {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      min-height: auto;
      height: 1.25em;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      margin: 0;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pax-location-search.location-active .pax-location-message {
      color: #4ade80;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      margin: -3px 0 0;
      min-height: auto;
    }
    body.theme-light .pax-btn {
      background: rgba(15,23,42,0.04);
      color: #111827;
      border-color: rgba(15,23,42,0.10);
    }
    body.theme-light .pax-btn.active-pax {
      background: #c7d92c;
      color: #0b0f14;
      border-color: transparent;
    }
    body.theme-light .pax-choice-btn {
      background: rgba(15,23,42,0.035);
      border-color: rgba(15,23,42,0.08);
      color: var(--ink);
    }
    body.theme-light .pax-choice-btn.active-pax {
      background: rgba(15,23,42,0.035);
      color: var(--ink);
      border-color: rgba(199,223,58,0.44);
    }
    body.theme-light .pax-choice-btn:active {
      background: rgba(15,23,42,0.035);
      color: var(--ink);
    }
    body.theme-light .pax-choice-btn:focus,
    body.theme-light .pax-choice-btn:focus-visible {
      background: rgba(15,23,42,0.035);
      color: var(--ink);
    }
    body.theme-light .pax-location-input {
      background: rgba(15,23,42,0.035);
      border-color: rgba(15,23,42,0.10);
      color: var(--ink);
    }
    body.theme-light .pax-location-input::placeholder { color: var(--ink); }
    body.theme-light .pax-location-result {
      background: rgba(15,23,42,0.035);
      border-color: rgba(15,23,42,0.08);
      color: var(--ink);
    }
    body.theme-light .pax-btn-sub { color: rgba(17,24,39,0.62); }
    body.theme-light .pax-btn.active-pax .pax-btn-sub { color: rgba(11,15,20,0.70); }
    body.theme-light .pax-choice-btn.active-pax .pax-btn-main { color: var(--ink); }
    body.theme-light .pax-choice-btn.active-pax .pax-btn-sub { color: #4ade80; }
    .pax-map-choice-row .pax-choice-btn:not(.active-pax) .pax-btn-sub,
    .pax-map-choice-row .pax-choice-btn.map-editing .pax-btn-sub,
    body.theme-light .pax-map-choice-row .pax-choice-btn:not(.active-pax) .pax-btn-sub,
    body.theme-light .pax-map-choice-row .pax-choice-btn.map-editing .pax-btn-sub {
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      margin-top: 0;
    }
    /* Sekundaerer Status */
    .pax-status {
      font-size: 12px;
      padding: 2px 0 0;
      color: rgba(234,240,255,0.70);
    }
    .pax-status.set { color: #4ade80; }
    .pax-status.marker-active {
      color: #4ade80;
      font-weight: 700;
    }
    body.theme-light .pax-status { color: rgba(17,24,39,0.72); }
    body.theme-light .pax-status.set { color: #4ade80; }
    body.theme-light .pax-status.marker-active { color: #4ade80; }
    .pax-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 5px 10px;
    }
    .pax-time-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .pax-time-btn {
      flex: 1 1 calc(33% - 4px);
      min-width: 52px;
      height: 30px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid rgba(199,223,58,0.20);
      background: rgba(17,24,37,0.28);
      color: #e5e7eb;
    }
    .pax-time-btn.selected {
      background: rgba(199,223,58,0.80);
      color: #0b0f14;
      border-color: transparent;
    }
    .pax-time-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .pax-locked-hint {
      font-size: 12px;
      opacity: 0.5;
      text-align: center;
      padding: 2px 0 0;
      display: none;
    }
    .pax-locked-hint.show { display: block; }
    .passenger-hint {
      font-size: 12px;
      opacity: 0.62;
      text-align: center;
      margin: 8px 0 0;
      padding: 0 16px 4px;
    }

    /* ── Mitfahrer: Zeitfeld nach GPS-Client-Prinzip ── */
    .pax-time-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-top: 2px;
      text-align: center;
    }
    .pax-time-label {
      font-size: 12px;
      opacity: .6;
    }
    .pax-time-input-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .pax-time-input-wrap input {
      text-align: center;
      width: 100%;
      max-width: none;
      border-radius: 10px;
      border: 1px solid rgba(199,223,58,0.18);
      background: rgba(17,24,37,0.28);
      color: #eaf0ff;
      height: 44px;
      padding: 10px 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .04em;
      box-sizing: border-box;
    }
    body.theme-light .pax-time-input-wrap input {
      background: rgba(255,255,255,0.82);
      color: #111827;
      border-color: rgba(15,23,42,0.10);
    }
    .pax-time-note {
      text-align: center;
      font-size: 12px;
      opacity: .62;
    }

    /* Zielbearbeitung bleibt eine normale Kartenflaeche; Gruen nur als Statussprache. */
    #paxTargetStatus.set { color: #4ade80; }

    /* ── Mitfahrer: Such-Buttons ── */
    .pax-search-actions {
      display: flex;
      gap: 8px;
      padding: 10px 16px 4px;
      box-sizing: border-box;
    }
    .pax-search-btn {
      flex: 1;
      min-height: 46px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: rgba(199,223,58,0.88);
      color: #0b0f14;
      transition: opacity .2s;
    }
    .pax-search-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    body.theme-light .pax-search-btn {
      background: #c7d92c;
      color: #0b0f14;
      border: none;
      box-shadow: 0 1px 0 rgba(15,23,42,0.08);
    }
    body.theme-light .pax-search-btn:active { opacity: 0.75; }
    body.theme-light .pax-search-btn:disabled {
      opacity: 0.35;
      box-shadow: none;
    }
    .pax-cancel-btn {
      flex: 0 0 auto;
      min-height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.12);
      color: #f87171;
      display: none;
    }
    body.theme-light .pax-cancel-btn {
      background: rgba(239,68,68,0.08);
      color: #b91c1c;
      border-color: rgba(239,68,68,0.28);
    }
    .pax-cancel-btn.show { display: flex; align-items: center; justify-content: center; }

    /* ── Mitfahrer: Trefferzähler ── */
    .pax-match-status {
      font-size: 12px;
      text-align: center;
      padding: 4px 10px 2px;
      min-height: 20px;
      color: rgba(234,240,255,0.70);
      display: none;
    }
    .pax-match-status.show { display: block; }
    .pax-match-status.found    { color: #4ade80; }
    .pax-match-status.none     { color: rgba(234,240,255,0.45); }
    .pax-match-status.cooldown { color: #fbbf24; }

    /* ── Trefferliste V1 ── */
    .pax-result-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 6px 10px 10px;
      box-sizing: border-box;
      max-height: 220px;
      overflow-y: auto;
    }
    .pax-result-list::-webkit-scrollbar { width: 3px; }
    .pax-result-list::-webkit-scrollbar-thumb { background: rgba(199,223,58,0.25); border-radius: 999px; }
    .pax-result-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "name cta"
        "meta cta";
      column-gap: 10px;
      row-gap: 5px;
      align-items: center;
      padding: 10px 11px;
      border-radius: 8px;
      background: rgba(17,24,37,0.82);
      border: 1px solid rgba(199,223,58,0.28);
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
      font-size: 12px;
      color: #eaf0ff;
    }
    .pax-result-item:hover, .pax-result-item:active {
      background: rgba(24,32,45,0.94);
      border-color: rgba(199,223,58,0.62);
      transform: translateY(-1px);
    }
    .pax-result-name {
      grid-area: name;
      font-weight: 800;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .pax-result-meta {
      grid-area: meta;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
    }
    .pax-result-pill {
      font-size: 11px;
      line-height: 1;
      color: rgba(234,240,255,0.86);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 5px 7px;
      white-space: nowrap;
    }
    .pax-result-cta {
      grid-area: cta;
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      padding: 0 10px;
      border-radius: 7px;
      background: #c7df3a;
      color: #0b0f14;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .input-button-group {
      width:100%;
      max-width: 260px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items:center;
      margin: 0 auto;
    }

    input {
      width:100%;
      max-width: 180px;
      background: rgba(17,24,37,0.28);
      border: 1px solid rgba(199,223,58,0.18);
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 14px;
      color: #e5e7eb;
      text-align: center;
    }

    .button-group {
      width:100%;
      display:flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      padding: 0 20px;
      box-sizing: border-box;
      margin: 0 auto;
    }
    .button-group::-webkit-scrollbar { height: 0px; }

    button {
      background: rgba(199,223,58,0.78);
      color: var(--accentText);
      height: 32px;
      min-width: 80px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 12.5px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button.secondary {
      background: rgba(17,24,37,0.28);
      border: 1px solid rgba(199,223,58,0.18);
      color: #e5e7eb;
      backdrop-filter: blur(10px);
    }

    .stat {
      margin-top:10px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      column-gap: 10px;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .stat .left { justify-self: start; display:flex; align-items:center; gap:6px; }
    .stat .mid {
      justify-self: center;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-width:0;
    }
    .stat .right { justify-self: end; }

    .stat2 {
      margin-top:8px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding: 0 10px;
      box-sizing: border-box;
      align-items: center;
    }
    .last-left { display:flex; align-items:center; gap:8px; }

    .sync {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(199,223,58,0.22);
      color: rgba(199,223,58,0.95);
      font-size: 12px;
      opacity: 0.0;
      transform: rotate(0deg);
      transition: opacity .15s ease;
      user-select: none;
    }
    .sync.on { opacity: 1.0; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stat3 {
      margin-top:8px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding: 0 10px;
      box-sizing: border-box;
      flex-wrap: nowrap;
    }

    /* ── NEU: Fahrten-Zähler + Mitfahrer-Name ── */
    .stat4 {
      margin-top:8px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .pulse { display:inline-block; padding: 0 6px; border-radius: 999px; transition: background-color .35s ease; }
    .pulse.flash { background: rgba(199,223,58,0.22); }
    .pulse.ride-flash { background: rgba(255,149,0,0.22); }

    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ef4444; }
    .dot.on { background:#22c55e; }

    .hint-inline {
      display:none;
      color:#00FF00;
      font-size:12px;
      line-height:1.15;
      font-weight:600;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
      white-space: normal;
      word-break: break-word;
      max-width: 190px;
      text-align: center;
    }
    .hint-inline.show { display:block; }

    /* ── Popup Basis ── */
    .mapboxgl-popup-content {
      background: rgba(17,24,37,0.92);
      color: #eaf0ff;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      box-shadow: 0 18px 44px rgba(0,0,0,.40);
      padding: 10px 10px 8px;
      backdrop-filter: blur(10px);
      min-width: 210px;
    }
    .mapboxgl-popup-tip {
      border-top-color: rgba(17,24,37,0.92) !important;
      border-bottom-color: rgba(17,24,37,0.92) !important;
    }
    .er-pop-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      margin: 0 0 6px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .er-pop-sub {
      font-size: 12px;
      color: rgba(234,240,255,0.78);
      margin: 0 0 8px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .er-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      white-space: nowrap;
    }
    .er-badge.ok    { border-color: rgba(34,197,94,0.35); }
    .er-badge.stale { border-color: rgba(239,68,68,0.35); }
    .er-badge.ride  { background: rgba(255,149,0,0.12); border-color: rgba(255,149,0,0.45); color: #ffb347; }

    .er-pop-actions { display:flex; gap: 8px; margin-top: 8px; }
    .er-pop-btn {
      flex:1;
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(199,223,58,0.18);
      background: rgba(17,24,37,0.35);
      color: #eaf0ff;
      font-size: 12px;
      cursor: pointer;
    }
    .er-pop-btn.primary {
      background: rgba(199,223,58,0.85);
      color: #0b0f14;
      border: none;
    }
    .er-pop-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── NEU: Ride-Popup spezifisch ── */
    .er-pop-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 8px 0;
    }
    .er-pop-details {
      font-size: 12px;
      color: rgba(234,240,255,0.70);
      display:flex;
      justify-content:center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .er-pop-input {
      width: 100%;
      background: rgba(17,24,37,0.50);
      border: 1px solid rgba(255,255,255,0.14);
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #e5e7eb;
      box-sizing: border-box;
      margin-bottom: 6px;
      text-align: left;
    }
    .er-pop-status {
      font-size: 11px;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .er-pop-status.ok  { background: rgba(34,197,94,0.13); color: #4ade80; display:block; }
    .er-pop-status.err { background: rgba(239,68,68,0.12); color: #f87171; display:block; }

    @media (max-width: 900px) {
      .panel { left:0; right:0; bottom:0; top:auto; width:auto; min-width: 0; }
      .panel-shell { width: 100%; }
      input { height: 40px; font-size: 15px; }
      button { height: 36px; font-size: 14px; }
      .hint-inline { max-width: 160px; }
    }

    /* Mobile: Mapbox-Controls ausblenden */
    @media (max-width: 900px) {
      .mapboxgl-ctrl-bottom-right,
      .mapboxgl-ctrl-bottom-left,
      .mapboxgl-ctrl-logo,
      .mapboxgl-ctrl-attrib { display: none !important; }
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="themeToggle" class="map-overlay-icon" role="button" tabindex="0" aria-label="Theme wechseln" title="Theme wechseln">◐</div>

  <div class="panel collapsed" id="bottomPanel" data-panel-state="collapsed">
    <div class="panel-shell" id="panelShell">
      <div class="title" id="panelTitle">
        <span class="panel-handle" role="button" tabindex="0" aria-expanded="false" aria-label="Panel ziehen oder öffnen"></span>
        <span class="title-text" id="panelStatusText">EcoRide</span>
      </div>

      <div class="panel-body" id="panelBody">
        <!-- ── MITFAHRER-PANEL ── -->
        <div class="mode-panel" id="passengerPanel">
      <div class="pax-brand-title">EcoRide</div>
      <div class="pax-flow-title">Plane deine Fahrt</div>

      <!-- Accordion Block 1: Abholpunkt – Header immer sichtbar -->
      <div class="pax-acc-block" id="paxAccBlock1">
        <div class="pax-acc-header" id="paxAccHeader1" role="button" aria-expanded="true">
          <span class="pax-acc-label" id="paxAccLabel1">Abholung</span>
          <span class="pax-acc-value" id="paxAccVal1"></span>
          <span class="pax-acc-edit pax-map-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"></path>
              <path d="M9 3v15"></path>
              <path d="M15 6v15"></path>
            </svg>
          </span>
        </div>
        <div class="pax-acc-body" id="paxAccBody1">
          <div class="pax-acc-inner">
            <div class="pax-pickup-options">
              <div class="pax-location-label">Mein Standort</div>
              <button class="pax-btn pax-choice-btn" id="btnPaxGps">
                <span class="pax-btn-main">GPS-Standort</span>
                <span class="pax-btn-sub">Aktuellen Standort verwenden</span>
              </button>
            </div>
            <div class="pax-address-choice-row" id="paxPickupAddressChoiceRow">
              <div class="pax-location-search" id="paxPickupLocationSearch">
                <div class="pax-location-label">Adresseingabe</div>
                <input
                  class="pax-location-input"
                  id="paxPickupLocationInput"
                  type="search"
                  inputmode="search"
                  placeholder="Ort oder Adresse suchen"
                  autocomplete="off"
                  enterkeyhint="search"
                />
                <div class="pax-location-results" id="paxPickupLocationResults"></div>
                <div class="pax-location-message" id="paxPickupLocationMessage"></div>
              </div>
              <button class="pax-map-clear-btn pax-address-clear-btn" id="btnPaxPickupAddressClear" type="button" hidden aria-label="Abholadresse aufheben" title="Abholadresse aufheben">X</button>
            </div>
            <div class="pax-pickup-options">
              <div class="pax-location-label">Dein Treffpunkt</div>
              <div class="pax-map-choice-row" id="paxPickupMapChoiceRow">
                <button class="pax-btn pax-choice-btn" id="btnPaxMarker">
                  <span class="pax-btn-main">Treffpunkt auf Karte wählen</span>
                  <span class="pax-btn-sub">Position selbst auf Karte festlegen</span>
                </button>
                <button class="pax-map-clear-btn" id="btnPaxMarkerClear" type="button" hidden aria-label="Treffpunkt aufheben" title="Treffpunkt aufheben">X</button>
              </div>
            </div>
            <div class="pax-status" id="paxMarkerStatus"></div>
          </div>
        </div>
      </div>

      <!-- Accordion Block 3: Ziel – sichtbar sobald Abholpunkt gesetzt -->
      <div class="pax-acc-block" id="paxAccBlock3" style="display:none">
        <div class="pax-acc-header" id="paxAccHeader3" role="button" aria-expanded="false">
          <span class="pax-acc-label">Ankunft</span>
          <span class="pax-acc-value" id="paxAccVal3">nicht gesetzt</span>
          <span class="pax-acc-edit pax-map-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"></path>
              <path d="M9 3v15"></path>
              <path d="M15 6v15"></path>
            </svg>
          </span>
        </div>
        <div class="pax-acc-body pax-closed" id="paxTargetBlock">
          <div class="pax-acc-inner">
            <div class="pax-address-choice-row" id="paxTargetAddressChoiceRow">
              <div class="pax-location-search" id="paxTargetLocationSearch">
                <div class="pax-location-label">Adresseingabe</div>
                <input
                  class="pax-location-input"
                  id="paxTargetLocationInput"
                  type="search"
                  inputmode="search"
                  placeholder="Ort oder Adresse suchen"
                  autocomplete="off"
                  enterkeyhint="search"
                />
                <div class="pax-location-results" id="paxTargetLocationResults"></div>
                <div class="pax-location-message" id="paxTargetLocationMessage"></div>
              </div>
              <button class="pax-map-clear-btn pax-address-clear-btn" id="btnPaxTargetAddressClear" type="button" hidden aria-label="Zieladresse aufheben" title="Zieladresse aufheben">X</button>
            </div>
            <div class="pax-location-label">Dein Endpunkt</div>
            <div class="pax-map-choice-row" id="paxTargetMapChoiceRow">
              <button class="pax-btn pax-choice-btn" id="btnPaxTarget">
                <span class="pax-btn-main">Ankunft auf Karte wählen</span>
                <span class="pax-btn-sub">Position selbst auf Karte festlegen</span>
              </button>
              <button class="pax-map-clear-btn" id="btnPaxTargetClear" type="button" hidden aria-label="Ziel aufheben" title="Ziel aufheben">X</button>
            </div>
            <div class="pax-status" id="paxTargetStatus"></div>
          </div>
        </div>
      </div>

      <!-- Accordion Block 2: Startzeitfenster – sichtbar sobald Abholpunkt gesetzt -->
      <div class="pax-acc-block" id="paxAccBlock2" style="display:none">
        <div class="pax-acc-header" id="paxAccHeader2" role="button" aria-expanded="false">
          <span class="pax-acc-label">Startzeit</span>
          <span class="pax-acc-value" id="paxAccVal2">HH:MM</span>
          <span class="pax-acc-edit pax-time-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </span>
        </div>
        <div class="pax-acc-body pax-closed" id="paxTimeBlock">
          <div class="pax-acc-inner">
            <div class="pax-time-inner">
              <div class="pax-time-label">Startzeit eingeben</div>
              <div class="pax-time-input-wrap">
                <input id="paxTimeInput" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" autocomplete="off" />
              </div>
              <div class="pax-time-note">Startzeitfenster für deine Fahrt</div>
            </div>
            <div class="pax-locked-hint" id="paxLockedHint">Suche abbrechen zum Ändern</div>
          </div>
        </div>
      </div>

      <!-- Block 4: Suche starten – sichtbar wenn Abholpunkt + Ziel gesetzt -->
      <div id="paxSearchBlock" style="display:none">
        <div class="pax-divider"></div>
        <div class="pax-search-actions">
          <button class="pax-search-btn" id="btnPaxSearch">Fahrer finden</button>
          <button class="pax-cancel-btn" id="btnPaxCancel">✕ Abbrechen</button>
        </div>
        <div class="pax-match-status" id="paxMatchStatus"></div>

      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getLocationSearchSessionToken(kind) {
      const state = paxLocationSearchState[kind];
      if (!state.sessionToken) {
        state.sessionToken = createSearchSessionToken();
      }
      return state.sessionToken;
    }

    function resetLocationSearchSession(kind) {
      paxLocationSearchState[kind].sessionToken = null;
    }

    function setLocationSearchMessage(kind, text) {
      const el = document.getElementById(paxLocationSearchConfig[kind].messageId);
      if (el) el.textContent = text || "";
    }

    function clearLocationSearchResults(kind) {
      const resultsEl = document.getElementById(paxLocationSearchConfig[kind].resultsId);
      if (!resultsEl) return;
      resultsEl.innerHTML = "";
      resultsEl.classList.remove("show");

    function setLocationSearchActiveUi(kind, label) {

      const root = document.getElementById(config.rootId);
      const input = document.getElementById(config.inputId);
      root?.classList.add("location-active");
      if (input && document.activeElement !== input) input.value = label || input.value;
      setLocationSearchMessage(kind, "aktiv");
    }

    function clearLocationSearchActiveUi(kind) {
      const root = document.getElementById(paxLocationSearchConfig[kind].rootId);
      root?.classList.remove("location-active");
    }

    function setPickupLocationMessage(text) {

    }

    function clearPaxPickupAddressSelection() {
      const addressWasActivePickup = paxPickupSource === "address";
      paxPickupLabel = "";
      clearPickupLocationSelection();

      if (!addressWasActivePickup) return;

      paxLat = null;
      paxLng = null;
      paxPickupSource = null;
      paxPendingPickupLng = null;
      paxPendingPickupLat = null;

    function clearPaxPickupMapSelection() {
      const mapWasActivePickup = paxPickupSource === "map";
      paxPickupMapLat = null;
      paxPickupMapLng = null;
      paxPendingPickupLng = null;
      paxPendingPickupLat = null;
      paxMarkerMode = false;

      if (mapWasActivePickup) {
        paxLat = null;
        paxLng = null;
        paxPickupSource = null;
      }

      restorePaxPickupMarkerToConfirmed();
      hideHint();
      updatePaxUI();

    function clearTargetLocationSelection() {
      const input = document.getElementById(paxLocationSearchConfig.target.inputId);
      if (input) input.value = "";

      clearLocationSearchResults("target");
      setLocationSearchMessage("target", "");
      resetLocationSearchSession("target");
    }

    function clearPaxTargetAddressSelection() {
      const addressWasActiveTarget = paxTargetSource === "address";
      paxTargetAddressResult = null;
      clearTargetLocationSelection();

      if (!addressWasActiveTarget) return;

      paxTargetLat = null;
      paxTargetLng = null;
      paxTargetSource = null;
      paxPendingTargetLng = null;
      paxPendingTargetLat = null;
      restorePaxTargetMarkerToConfirmed();
    }

    function clearPaxTargetMapSelection() {
      const mapWasActiveTarget = paxTargetSource === "map";
      paxTargetMapLat = null;
      paxTargetMapLng = null;
      paxPendingTargetLng = null;
      paxPendingTargetLat = null;
      paxTargetMode = false;

      if (mapWasActiveTarget) {
        paxTargetLat = null;
        paxTargetLng = null;
        paxTargetSource = null;
      }

      restorePaxTargetMarkerToConfirmed();
      hideHint();
      updatePaxUI();
