      btnGeo.addEventListener("click", (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        if (!navigator.geolocation) { setStatus("GPS nicht verfügbar.", true); return; }
        btnGeo.textContent = "…";
        btnGeo.disabled = true;
        clearStatus();
        navigator.geolocation.getCurrentPosition(
          pos => {
            pickupLat = pos.coords.latitude;
            pickupLng = pos.coords.longitude;
            geoReady  = true;
            btnGeo.textContent = "✅ Standort";
            btnGeo.disabled = false;
            setStatus(`Abholpunkt gesetzt ✅`);
          },
          err => {
            btnGeo.textContent = "📍 Standort";
            btnGeo.disabled = false;
            setStatus("GPS-Fehler: " + err.message, true);
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });

      // Anfragen-Button
      btnAnfragen.addEventListener("click", async (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const name = nameInput.value.trim();
        if (!name) { setStatus("Bitte Namen eingeben.", true); return; }
        if (pickupLat === null || pickupLng === null) {
          setStatus("Bitte zuerst Standort bestimmen.", true); return;
        }
        btnAnfragen.disabled = true;
        btnAnfragen.textContent = "Sende…";
        clearStatus();
        try {
          localStorage.setItem("er_mitfahrer_name", name);
          await submitRequest(rideId, pickupLat, pickupLng, name);
          setStatus("Anfrage gesendet! Der Fahrer wird informiert. ✅");
          btnAnfragen.textContent = "Gesendet ✅";
        } catch (e) {
          logError("ERR_SUBMIT_REQUEST", e.message);
          setStatus("Fehler: " + e.message, true);
          btnAnfragen.disabled = false;
          btnAnfragen.textContent = "Anfragen →";
        }
      });

      const coords = feature.geometry?.coordinates;
      if (!Array.isArray(coords) || coords.length !== 2) return;

      ridePopup = new mapboxgl.Popup({ closeButton: true, closeOnClick: true, offset: 14, maxWidth: "270px" })
        .setLngLat(coords).setDOMContent(root).addTo(map);
    }

    // ─────────────────────────────────────────────────
    // NEU: MITFAHRER USER (localStorage-basiert)
    // ─────────────────────────────────────────────────
    async function getOrCreateMitfahrer(name) {
      if (mitfahrerId) return mitfahrerId;
      const { data, error } = await sb
        .from("users")
        .insert({ name: name.trim(), rolle: "mitfahrer" })
        .select("id")
        .single();
      if (error) throw new Error(error.message);
      mitfahrerId = data.id;
      localStorage.setItem("er_mitfahrer_id", mitfahrerId);
      return mitfahrerId;
    }

    async function submitRequest(rideId, pickupLat, pickupLng, name) {
      const uid = await getOrCreateMitfahrer(name);
      const { error } = await sb.from("requests").insert({
        mitfahrer_id: uid,
        ride_id:      rideId,
        pickup_lat:   pickupLat,
        pickup_lng:   pickupLng,
        status:       "offen",
      });
      if (error) throw new Error(error.message);
    }

    // ─────────────────────────────────────────────────
    // IMPACT POLLING
    // ─────────────────────────────────────────────────
    function clearImpactTimer() { if (impactTimer) { clearTimeout(impactTimer); impactTimer = null; } }
    function scheduleImpactPoll(immediate = false) {
      clearImpactTimer();
      if (!shouldPollImpact()) return;
      const nextMs = immediate ? IMPACT_MIN_MS : Math.max(IMPACT_OK_MS, IMPACT_BACKOFF[impactBackoffIdx] ?? IMPACT_MAX_MS);
      impactTimer = setTimeout(() => { fetchImpactOnce().catch(() => {}); }, nextMs);
    }
    function onVisibilityOrPanelChange() {
      if (shouldPollImpact()) { fetchImpactOnce().catch(() => {}); scheduleImpactPoll(false); }
      else clearImpactTimer();
    }
    // Timestamp letzten manuellen Ride-Endes – Impact-RPC für 3 Min. übersteuern
    let manualEndedAt = 0;
    let manualEndedDriverKey = null; // driverKey des manuell beendeten Fahrers

    // Sofortiger Reset der Impact-Anzeige bei manuellem Ride-Ende
    function resetImpactCounters(driverKey) {
      manualEndedAt = Date.now();
      if (driverKey) {
        handleObservedRideEnded(driverKey);
        snapshotMapState("rideEnd:before-cleanup", driverKey);
        manualEndedDriverKey = driverKey;
        recentlyEnded.add(driverKey);
        endedDrivers.add(driverKey);
        endedDriverAt.set(driverKey, manualEndedAt);
        positions.delete(driverKey);
        routePoints.delete(driverKey);
        for (const [rideId, ride] of [...activeRides.entries()]) {
          if (normId(ride.driver_id) === driverKey) activeRides.delete(rideId);
        }
        snapshotMapState("rideEnd:after-state-cleanup", driverKey);
        hideAllDriverLayersImmediately();
        clearSelection();
        if (map?.getSource?.(DRIVERS_SOURCE)) {
          logMapPath("rideEnd:driver-source-before-empty", { sourceFeatureCountBefore: getDriverSourceFeatureCount() });
          setDriversSourceData({ type: "FeatureCollection", features: [] });
          logMapPath("rideEnd:driver-source-after-empty", { sourceFeatureCountAfter: getDriverSourceFeatureCount() });
        }
        if (map?.getSource?.(RIDES_ROUTE_SOURCE)) {
          map.getSource(RIDES_ROUTE_SOURCE).setData({ type: "FeatureCollection", features: [] });
        }
        if (map?.getSource?.(RIDES_SOURCE)) {
          map.getSource(RIDES_SOURCE).setData({ type: "FeatureCollection", features: [] });
        }
        snapshotMapState("rideEnd:after-source-set", driverKey);
        rebuildDriverRenderPathEmpty();
        refreshDriversSource("rideEnd:after-rebuild");
        refreshRoutesSource();
        refreshRidesSource();
        map?.triggerRepaint?.();
        setTimeout(() => snapshotMapState("rideEnd:+1s", driverKey), 1000);
        setTimeout(() => snapshotMapState("rideEnd:+5s", driverKey), 5000);
        setTimeout(() => snapshotMapState("rideEnd:+10s", driverKey), 10000);
      }
      // Timer stoppen damit kein Poll den Wert sofort überschreibt
      clearImpactTimer();
      const rideCount   = getVisibleActiveRides().length;
      setSafeTextContent("impactActive",   String(getActiveDriverCount()));
      setSafeTextContent("impactPoints10", "0");
      setSafeTextContent("impactMarkers",  String(getVisiblePositionsCount()));
      setSafeTextContent("rideCountTxt",   String(rideCount));
      pulse("impactActive");
      // Erst nach 3 Min. wieder pollen (DB-Zeitfenster abgelaufen)
      setTimeout(() => {
        manualEndedAt = 0;
        manualEndedDriverKey = null;
        if (driverKey) {
          recentlyEnded.delete(driverKey);
          endedDrivers.delete(driverKey);
          endedDriverAt.delete(driverKey);
        }
        scheduleImpactPoll();
      }, 3 * 60_000);
    }

    async function fetchImpactOnce() {
      if (!shouldPollImpact() || impactInFlight) return;

      // Nach manuellem Ride-Ende: 3 Min. lang positions.size verwenden statt DB-Wert
      // (DB-Zeitfenster zählt noch 2 Min. lang alte GPS-Punkte)
      const sinceManualEnd = Date.now() - manualEndedAt;
      if (manualEndedAt > 0 && sinceManualEnd < 3 * 60_000) {
        setSafeTextContent("impactActive", String(getActiveDriverCount()));
        setSafeTextContent("impactMarkers", String(positions.size));
        scheduleImpactPoll();
        return;
      }

      impactInFlight = true; setSync(true);
      try {
        const { data, error } = await sb.rpc("get_live_impact", { active_minutes: 2, points_minutes: 10 });
        if (error) throw new Error(error.message);
        const row = Array.isArray(data) ? data[0] : data;
        if (!row) throw new Error("RPC returned no rows");
        setSafeTextContent("impactActive",   String(getActiveDriverCount()));
        setSafeTextContent("impactPoints10", String(row.points_window  ?? 0));
        pulse("impactActive"); pulse("impactPoints10");
        lastImpactOkAt = Date.now(); impactBackoffIdx = 0; setLast(new Date());
      } catch (e) {
        logError("ERR_RPC_IMPACT", e?.message || String(e));
        showHint("Impact temporär nicht verfügbar.");
        impactBackoffIdx = Math.min(impactBackoffIdx + 1, IMPACT_BACKOFF.length - 1);
      } finally { impactInFlight = false; setSync(false); }
      scheduleImpactPoll();
    }

    // ─────────────────────────────────────────────────
    // ROUTES SOURCE
    // ─────────────────────────────────────────────────
    function refreshRoutesSource() {
      if (!map || !routesReady || !map.getSource("er-routes")) return;
      const features = [];
      for (const [driverKey, pts] of routePoints.entries()) {
        if (!pts || pts.length < 2) continue;
        if (currentFilterKey && driverKey !== currentFilterKey) continue;
        features.push({
          type: "Feature",
          properties: { driverKey, color: getColorForDriver(driverKey) },
          geometry: { type: "LineString", coordinates: pts.map(p => [p.lng, p.lat]) }
        });
      }
      map.getSource("er-routes").setData({ type: "FeatureCollection", features });
      refreshSelectedRouteSource();
      if (!isPanelOpen()) return;
      if (features.length === 0 && currentFilterKey) showHint("Keine Route für diesen Fahrer.");
      else if (features.length === 0) showHint("Keine Routen verfügbar.");
      else hideHint();
    }

    // ─────────────────────────────────────────────────
    // MAPBOX INIT
    // ─────────────────────────────────────────────────
    function initMapbox() {
      mapboxgl.accessToken = CONFIG.mapboxToken;
      const m = new mapboxgl.Map({
        container: "map",
        style: MAP_STYLES[currentTheme],
        center: DEFAULT_CENTER,
        zoom: DEFAULT_ZOOM,
      });
      // NavigationControl bewusst entfernt: Mobile nutzt Pinch-to-Zoom

      m.on("load", () => {
        hideHint();
        initMapboxLayers(m);
        refreshDriversSource("map-load");
        refreshRoutesSource();
        refreshRidesSource();
      });

      m.on("error", (e) => {
        logError("ERR_MAPBOX", "Mapbox error", { err: e?.error || e });
        showHint("Karte konnte nicht geladen werden.");
      });
      return m;
    }

    // ─────────────────────────────────────────────────
    // FETCH: LATEST POSITIONS
    // ─────────────────────────────────────────────────
    async function fetchLatest(cutoffOverride) {
      const seq = ++latestFetchSeq;
      const now = Date.now();
      // Fetch-Cutoff am Ride-Fenster ausrichten, Marker-Frische wird danach separat geprüft
      const fallbackIso = new Date(now - RIDE_FRESH_MS).toISOString();
      const cutoffIso = normalizeCutoff(cutoffOverride, fallbackIso);

      if (currentFilterKey) {
        const idExact = String(currentFilter || "").trim();
        if (!idExact) return;
        const { data, error } = await sb.from("v_live_positions_latest")
          .select("driver_id,lat,lng,updated_at").ilike("driver_id", idExact)
          .gte("updated_at", cutoffIso).limit(1);
        if (seq !== latestFetchSeq) return;
        if (error) { logError("ERR_FETCH_LATEST_FOLLOW_V", error.message); showHint("Fehler beim Laden."); return; }
        logMapPath("fetchLatest:rows(filter)", (data || []).map(r => ({ driver_id: r?.driver_id, lat: r?.lat, lng: r?.lng, updated_at: r?.updated_at })));
        const row = data?.[0] ?? null;
        if (!row) {
          const driverKey = normId(idExact);
          removeOrphanedDriverPosition(driverKey, "fetchLatest-filter-no-remote-row");
          logMapPath("fetchLatest:skip(filter)", { reason: "no-row" });
          showHint("Kein frisches Signal für diesen Fahrer.");
          refreshDriversSource("fetchLatest-filter-no-row");
          refreshRoutesSource();
          refreshRidesSource();
          return;
        }
        const rawId = (row.driver_id ?? "").toString();
        const driverKey = normId(rawId);
        const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
        rememberDriverSignal(driverKey, ts);
        if (endedDrivers.has(driverKey)) {
          const endedAt = endedDriverAt.get(driverKey) || 0;
          if (ts <= endedAt + 20_000) {
            logMapPath("fetchLatest:skip(filter)", { reason: "ended-driver", driverKey, ts, endedAt, guardMs: 20000 });
            clearDriverLiveState(driverKey, "fetchLatest-filter-ended-driver");
            refreshDriversSource("fetchLatest-filter-ended-driver");
            refreshRidesSource();
            return;
          }
          recentlyEnded.delete(driverKey);
          endedDrivers.delete(driverKey);
          endedDriverAt.delete(driverKey);
        }
        const lat = Number(row.lat), lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) { logMapPath("fetchLatest:skip(filter)", { reason: "invalid-lat-lng", driverKey, lat, lng }); return; }
        const nowMs = Date.now();
        const ageMs = nowMs - ts;
        if (ageMs > RIDE_FRESH_MS) {
          removeOrphanedDriverPosition(driverKey, "fetchLatest-filter-stale-remote-row");
          logMapPath("fetchLatest:skip(filter)", { reason: "stale-position", driverKey, updated_at: row.updated_at, nowMs, ts, ageMs, threshold: RIDE_FRESH_MS });
          refreshDriversSource("fetchLatest-filter-stale");
          refreshRoutesSource();
          refreshRidesSource();
          return;
        }
        positions.clear();
        positions.set(driverKey, { rawId, lng, lat, ts });
        logMapPath("fetchLatest:set(filter)", { driverKey, rawId, lat, lng, updated_at: row.updated_at, positionsSize: positions.size, ageMs });
        map.easeTo({ center: [lng, lat], zoom: 14, duration: 600 });
        setLast(new Date()); refreshDriversSource("fetchLatest-filter-set"); refreshRidesSource();
        return;
      }

      const { data, error } = await sb.from("v_live_positions_latest")
        .select("driver_id,lat,lng,updated_at").gte("updated_at", cutoffIso)
        .limit(BBOX_LIMIT_LATEST);
      if (seq !== latestFetchSeq) return;
      if (error) { logError("ERR_FETCH_LATEST_BBOX_V", error.message); showHint("Fehler beim Laden."); return; }
      logMapPath("fetchLatest:rows", (data || []).map(r => ({ driver_id: r?.driver_id, lat: r?.lat, lng: r?.lng, updated_at: r?.updated_at })));
      const nextPositions = new Map();
      const remoteDriverKeys = new Set();
      for (const row of data || []) {
        const rawId = (row?.driver_id ?? "").toString();
        const key = normId(rawId);
        if (!key) { logMapPath("fetchLatest:skip", { reason: "empty-normalized-driverKey", rawId }); continue; }
        remoteDriverKeys.add(key);
        const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
        rememberDriverSignal(key, ts);
        if (endedDrivers.has(key)) {
          const endedAt = endedDriverAt.get(key) || 0;
          if (ts <= endedAt + 20_000) {
            logMapPath("fetchLatest:skip", { reason: "ended-driver", driverKey: key, ts, endedAt, guardMs: 20000 });
            continue;
          }
          recentlyEnded.delete(key);
          endedDrivers.delete(key);
          endedDriverAt.delete(key);
        }
        const lat = Number(row.lat), lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) { logMapPath("fetchLatest:skip", { reason: "invalid-lat-lng", driverKey: key, lat, lng }); continue; }
        const nowMs = Date.now();
        const ageMs = nowMs - ts;
        if (ageMs > RIDE_FRESH_MS) { logMapPath("fetchLatest:skip", { reason: "stale-position", driverKey: key, updated_at: row.updated_at, nowMs, ts, ageMs, threshold: RIDE_FRESH_MS }); continue; }
        nextPositions.set(key, { rawId: row.driver_id, lng, lat, ts });
        logMapPath("fetchLatest:set", { driverKey: key, rawId, lat, lng, updated_at: row.updated_at, positionsSize: nextPositions.size, ageMs });
      }
      for (const [key, pos] of positions.entries()) {
        if (nextPositions.has(key)) continue;
        if (!remoteDriverKeys.has(key) && hasRunningRideForDriver(key)) {
          nextPositions.set(key, pos);
          logMapPath("fetchLatest:preserve-running-ride-position", { driverKey: key });
          continue;
        }
        if (!remoteDriverKeys.has(key)) clearDriverLiveState(key, "fetchLatest-remote-sync-missing");
      }
      positions.clear();
      for (const [key, pos] of nextPositions.entries()) positions.set(key, pos);
      setLast(new Date()); refreshDriversSource("fetchLatest-set"); refreshRidesSource();
    }

    // ─────────────────────────────────────────────────
    // FETCH: ROUTE HISTORY
    // ─────────────────────────────────────────────────
    async function fetchRouteHistory(cutoffOverride) {
      const seq = ++routeFetchSeq;
      const now = Date.now();
      const fallbackIso = new Date(now - (activeOnlyMode ? ACTIVE_ONLY_MS : ROUTE_MS)).toISOString();
      const cutoffIso = normalizeCutoff(cutoffOverride, fallbackIso);
      routePoints.clear();

      if (currentFilterKey) {
        const idExact = String(currentFilter || "").trim();
        if (!idExact) { refreshRoutesSource(); return; }
        const { data, error } = await sb.from("live_positions")
          .select("driver_id,lat,lng,updated_at").ilike("driver_id", idExact)
          .gte("updated_at", cutoffIso).order("updated_at", { ascending: true }).limit(MAX_POINTS);
        if (seq !== routeFetchSeq) return;
        if (error) { logError("ERR_FETCH_ROUTE_FOLLOW", error.message); return; }
        const key = normId(idExact), arr = [];
        for (const row of data || []) {
          const lat = Number(row.lat), lng = Number(row.lng);
          if (!isValidLatLng(lat, lng)) continue;
          const ts = row.updated_at ? new Date(row.updated_at).getTime() : null;
          if (!ts) continue;
          rememberDriverSignal(key, ts);
          arr.push({ lng, lat, ts });
        }
        const minTs = now - ROUTE_MS;
        while (arr.length && arr[0].ts < minTs) arr.shift();
        if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
        if (arr.length >= 2) routePoints.set(key, arr);
        refreshRoutesSource(); return;
      }

      const bb = getBoundsBBoxPadded();
      if (!bb) { refreshRoutesSource(); return; }
      const { data, error } = await sb.from("live_positions")
        .select("driver_id,lat,lng,updated_at").gte("updated_at", cutoffIso)
        .gte("lat", bb.south).lte("lat", bb.north).gte("lng", bb.west).lte("lng", bb.east)
        .order("driver_id", { ascending: true }).order("updated_at", { ascending: true })
        .limit(BBOX_LIMIT_ROUTE_POINTS);
      if (seq !== routeFetchSeq) return;
      if (error) { logError("ERR_FETCH_ROUTE_BBOX", error.message); return; }
      for (const row of data || []) {
        const driverKey = normId(row?.driver_id); if (!driverKey) continue;
        const lat = Number(row.lat), lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) continue;
        const ts = row.updated_at ? new Date(row.updated_at).getTime() : null;
        if (!ts) continue;
        rememberDriverSignal(driverKey, ts);
        const arr = routePoints.get(driverKey) ?? [];
        arr.push({ lng, lat, ts }); routePoints.set(driverKey, arr);
      }
      for (const [driverKey, arr] of routePoints.entries()) {
        const minTs = now - ROUTE_MS;
        while (arr.length && arr[0].ts < minTs) arr.shift();
        if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
        const last = arr[arr.length - 1];
        if (!last || (now - last.ts > RIDE_FRESH_MS) || arr.length < 2) routePoints.delete(driverKey);
      }
      refreshRoutesSource();
    }

    // ─────────────────────────────────────────────────
    // NEU: FETCH: AKTIVE FAHRTEN
    // Lädt Position eines reaktivierten Fahrers direkt per driver_id (kein BBox-Filter)
    // Retry bis Position in v_live_positions_latest sichtbar oder Timeout
    async function fetchPositionWithRetry(driverKey, attempts = 5, delayMs = 1500) {
      for (let i = 0; i < attempts; i++) {
        if (i > 0) await new Promise(r => setTimeout(r, delayMs));
        if (endedDrivers.has(driverKey)) return; // inzwischen wieder beendet
        const { data, error } = await sb.from("v_live_positions_latest")
          .select("driver_id,lat,lng,updated_at")
          .ilike("driver_id", driverKey)
          .limit(1);
        if (error) { logError("ERR_FETCH_POS_RETRY", error.message); continue; }
        const row = data?.[0];
        if (!row) { logDebug("fetchPositionWithRetry: kein Eintrag (Versuch", i + 1, "):", driverKey); continue; }
        const lat = Number(row.lat), lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) return;
        const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
        rememberDriverSignal(driverKey, ts);
        if (Date.now() - ts > RIDE_FRESH_MS) return; // Position zu alt
        const rawId = (row.driver_id ?? "").toString();
        positions.set(driverKey, { rawId, lng, lat, ts });
        logDebug("fetchPositionWithRetry: Position gesetzt (Versuch", i + 1, "):", driverKey);
        refreshDriversSource("fetchPositionWithRetry");
        return;
      }
      logDebug("fetchPositionWithRetry: kein Ergebnis nach", attempts, "Versuchen für", driverKey);
    }

    // ─────────────────────────────────────────────────
    async function fetchActiveRides() {
      const seq = ++ridesFetchSeq;
      const [activeRes, offeredRes] = await Promise.all([
        sb.from("v_aktive_fahrten").select(
          "ride_id,driver_id,fahrer_name,fahrer_bewertung,fahrer_lat,fahrer_lng,ziel_lat,ziel_lng,plaetze,preis,route_punkte,erstellt_am"
        ).limit(200),
        sb.from("rides").select(
          "id,driver_id,start_lat,start_lng,ziel_lat,ziel_lng,plaetze,preis,route_punkte,status,erstellt_am,departure_time"
        ).eq("status", "angeboten").limit(200)
      ]);
      if (seq !== ridesFetchSeq) return;
      if (activeRes.error) { logError("ERR_FETCH_RIDES", activeRes.error.message); return; }
      if (offeredRes.error) { logError("ERR_FETCH_OFFERED_RIDES", offeredRes.error.message); return; }
      const data = [
        ...((activeRes.data || []).map(row => ({ ...row, ride_id: row.ride_id || row.id, status: row.status || "aktiv" }))),
        ...((offeredRes.data || []).map(row => ({
          ride_id: row.id,
          driver_id: row.driver_id,
          fahrer_name: row.driver_id,
          fahrer_bewertung: null,
          fahrer_lat: row.start_lat,
          fahrer_lng: row.start_lng,
          ziel_lat: row.ziel_lat,
          ziel_lng: row.ziel_lng,
          plaetze: row.plaetze,
          preis: row.preis,
          route_punkte: row.route_punkte,
          erstellt_am: row.erstellt_am,
          departure_time: row.departure_time,
          status: row.status || "angeboten"
        })))
      ];

      // Fahrer die vorher aktiv waren merken
      const prevDriverKeys = new Set(
        getVisibleActiveRides().map(([, r]) => normId(r.driver_id))
      );

      activeRides.clear();
      const reactivatedDrivers = new Set(); // Fahrer die gerade entsperrt wurden
      for (const row of data || []) {
        if (!row.ride_id) continue;
        const driverKey = normId(row.driver_id);
        if (!driverKey) continue;
        // Neue bestätigte Fahrt → Sperren sofort aufheben (Neustart desselben Fahrers)
        if (recentlyEnded.has(driverKey) || endedDrivers.has(driverKey)) {
          recentlyEnded.delete(driverKey);
          endedDrivers.delete(driverKey);
          endedDriverAt.delete(driverKey);
          reactivatedDrivers.add(driverKey); // Position fehlt → fetchLatest nötig
        }
        activeRides.set(row.ride_id, row);
      }
      // Reaktivierte Fahrer: positions ist leer → Retry per driver_id bis Marker erscheint
      for (const dk of reactivatedDrivers) {
        fetchPositionWithRetry(dk).catch(() => {});
      }

      // Fahrer die nicht mehr in aktiven Rides sind:
      // Bei manuell beendeter Fahrt Marker sofort entfernen,
      // unabhängig von STALE-/Fresh-Logik.
      const nowDriverKeys = new Set(
        [...activeRides.values()].map(r => normId(r.driver_id))
      );
      let markerChanged = false;
      for (const driverKey of prevDriverKeys) {
        if (!nowDriverKeys.has(driverKey)) {
          handleObservedRideEnded(driverKey);
          endedDrivers.add(driverKey);
          positions.delete(driverKey);
          routePoints.delete(driverKey);
          driverSignalTs.delete(driverKey);
          markerChanged = true;
        }
      }

      // Ohne aktive Fahrt keine Ride-Route und keinen Fahrer-Marker mehr zeigen.
      const now = Date.now();
      for (const [key, pos] of positions.entries()) {
        if (nowDriverKeys.has(key)) continue;
        if (recentlyEnded.has(key)) continue; // manuell gesperrt → bereits behandelt
        const posAge = now - (pos.ts ?? 0);
        if (posAge < 10_000) continue; // kurzes Schonfenster gegen Race zwischen Position und Ride-Update
        endedDrivers.add(key);
        positions.delete(key);
        routePoints.delete(key);
        markerChanged = true;
      }

      // Zusatzschutz: wenn eine aktive Fahrt endet, darf kein alter Marker über einen
      // zweiten Renderpfad wieder sichtbar bleiben. Deshalb alle aktiven DriverKeys,
      // die nicht mehr in activeRides enthalten sind, konsequent aus der Driver-Source drücken.
      if (positions.size === 0 && nowDriverKeys.size === 0 && map?.getSource?.(DRIVERS_SOURCE)) {
        logMapPath("fetchActiveRides:force-empty-driver-source", {
          positionsSize: positions.size,
          activeRidesSize: activeRides.size,
          sourceFeatureCountBefore: getDriverSourceFeatureCount()
        });
        setDriversSourceData({ type: "FeatureCollection", features: [] });
        hideAllDriverLayersImmediately();
        markerChanged = true;
      }

      if (markerChanged) {
        logMapPath("fetchActiveRides:driver-render-refresh", {
          positionsSize: positions.size,
          activeRidesSize: activeRides.size,
          sourceFeatureCountBefore: getDriverSourceFeatureCount()
        });
        refreshDriversSource("fetchActiveRides:markerChanged");
        refreshRoutesSource();
        logMapPath("fetchActiveRides:driver-render-refresh:done", {
          positionsSize: positions.size,
          activeRidesSize: activeRides.size,
          sourceFeatureCountAfter: getDriverSourceFeatureCount()
        });
      }

      refreshDriversSource("fetchActiveRides:end");
      refreshRidesSource();
    }

    // ─────────────────────────────────────────────────
    // REALTIME: LIVE_POSITIONS
    // ─────────────────────────────────────────────────
    function subscribe() {
      if (!sb || rtConnecting) return;
      rtConnecting = true;
      try { if (channel) sb.removeChannel(channel); } catch (_) {}

      channel = sb.channel("live_positions_map")
        .on("postgres_changes", { event: "*", schema: "public", table: "live_positions" }, (payload) => {
          if (payload?.eventType === "INSERT" || payload?.eventType === "UPDATE") {
            upsertRealtime(payload.new);
          } else if (payload?.eventType === "DELETE") {
            const key = normId(payload.old?.driver_id || payload.old?.id || payload.new?.driver_id || payload.new?.id);
            if (key) {
              const endedAt = Date.now();
              handleObservedRideEnded(key);
              endedDrivers.add(key);
              endedDriverAt.set(key, endedAt);
              recentlyEnded.add(key);
              clearDriverLiveState(key, "live_positions-realtime-delete");
              // Auch zugehörige Rides sofort entfernen → Zielpunkt + Route weg
              for (const [rideId, ride] of activeRides.entries()) {
                if (normId(ride.driver_id) === key) activeRides.delete(rideId);
              }
              refreshDriversSource("realtime-delete");
              refreshRoutesSource();
              refreshRidesSource();
            } else {
              logMapPath("live_positions-delete-without-driver-key", { old: payload.old || null });
              fetchLatest()
                .then(() => fetchActiveRides())
                .catch(e => logError("ERR_DELETE_RESYNC", e?.message || String(e)));
            }
          }
        })
        .subscribe((status) => {
          rtLastStatus = status;
          if (status === "SUBSCRIBED") { rtLastOkAt = Date.now(); rtReconnectIdx = 0; setRealtimeState("AN"); }
          else if (["CLOSED","CHANNEL_ERROR","TIMED_OUT"].includes(status)) setRealtimeState("RECONNECT");
          else setRealtimeState("AUS");
          logDebug("Realtime status:", status);
          rtConnecting = false;
        });
      startRealtimeWatchdog();
    }

    // ─────────────────────────────────────────────────
    // NEU: REALTIME: RIDES
    // ─────────────────────────────────────────────────
    function subscribeRides() {
      if (!sb) return;
      try { if (ridesChannel) sb.removeChannel(ridesChannel); } catch (_) {}

      ridesChannel = sb.channel("rides_map")
        .on("postgres_changes", { event: "*", schema: "public", table: "rides" }, async (payload) => {
          const ev     = payload?.eventType;
          const rideId = payload.new?.id || payload.old?.id;

          if (ev === "DELETE") {
            if (rideId) {
              activeRides.delete(rideId);
              const driverKey = normId(payload.old?.driver_id);
              if (driverKey) {
                endedDrivers.add(driverKey);
                positions.delete(driverKey);
                routePoints.delete(driverKey);
              }
              refreshRidesSource();
              refreshDriversSource("realtime-ride-delete");
              refreshRoutesSource();
              resetImpactCounters(driverKey); // Aktiv sofort auf 0, driverKey sperren
              return;
            }
          }
          if (!rideId) return;
          if (ev === "UPDATE" && !["aktiv", "angeboten"].includes(payload.new?.status)) {
            activeRides.delete(rideId);
            const driverKey = normId(payload.new?.driver_id);
            if (driverKey) {
              endedDrivers.add(driverKey);
              positions.delete(driverKey);
              routePoints.delete(driverKey);
              driverSignalTs.delete(driverKey);
            }
            refreshRidesSource();
            refreshDriversSource("realtime-ride-status-ended");
            refreshRoutesSource();
            resetImpactCounters(driverKey); // Aktiv sofort auf 0, driverKey sperren
            return;
          }
          if (ev === "INSERT" && !["aktiv", "angeboten"].includes(payload.new?.status)) return;

          // Sofort versuchen (View-JOIN braucht manchmal 1–2s)
          async function loadRideWithRetry(id, attempts = 3, delayMs = 1500) {
            for (let i = 0; i < attempts; i++) {
              if (i > 0) await new Promise(r => setTimeout(r, delayMs));
              const isOffered = payload.new?.status === "angeboten";
              const rideRes = isOffered
                ? await sb.from("rides").select("id,driver_id,start_lat,start_lng,ziel_lat,ziel_lng,plaetze,preis,route_punkte,status,erstellt_am,departure_time").eq("id", id).single()
                : await sb.from("v_aktive_fahrten").select("*").eq("ride_id", id).single();
              const data = isOffered && rideRes.data ? {
                ride_id: rideRes.data.id,
                driver_id: rideRes.data.driver_id,
                fahrer_name: rideRes.data.driver_id,
                fahrer_bewertung: null,
                fahrer_lat: rideRes.data.start_lat,
                fahrer_lng: rideRes.data.start_lng,
                ziel_lat: rideRes.data.ziel_lat,
                ziel_lng: rideRes.data.ziel_lng,
                plaetze: rideRes.data.plaetze,
                preis: rideRes.data.preis,
                route_punkte: rideRes.data.route_punkte,
                erstellt_am: rideRes.data.erstellt_am,
                departure_time: rideRes.data.departure_time,
                status: rideRes.data.status || "angeboten"
              } : rideRes.data;
              const error = rideRes.error;
              if (!error && data) {
                const dk = normId(data.driver_id);
                const wasBlocked = recentlyEnded.has(dk) || endedDrivers.has(dk);
                recentlyEnded.delete(dk);
                endedDrivers.delete(dk);
                activeRides.set(id, data);
                refreshDriversSource("realtime-ride-visible");
                refreshRidesSource();
                if (wasBlocked) fetchPositionWithRetry(dk).catch(() => {}); // Position neu laden → Marker
                logDebug("Ride geladen nach", i, "Retry(s):", id);
                return;
              }
              logDebug("Ride noch nicht in View (Versuch", i + 1, "):", error?.message);
            }
            // Letzter Fallback: vollen Fetch
            logDebug("Ride-Einzelabruf fehlgeschlagen – lade alle aktiven Rides");
            await fetchActiveRides().catch(() => {});
          }
          loadRideWithRetry(rideId).catch(() => {});
        })
        .subscribe((status) => { logDebug("Rides channel:", status); });
    }

    // ─────────────────────────────────────────────────
    // REALTIME WATCHDOG
    // ─────────────────────────────────────────────────
    function startRealtimeWatchdog() {
      if (rtWatchdogTimer) return;
      rtWatchdogTimer = setInterval(() => {
        if (!isTabVisible()) return;
        const age = Date.now() - (rtLastOkAt || 0);
        if (rtLastStatus !== "SUBSCRIBED" && age > RT_STALE_MS) {
          const wait = RT_RECONNECT_BACKOFF[Math.min(rtReconnectIdx, RT_RECONNECT_BACKOFF.length - 1)];
          rtReconnectIdx++;
          setRealtimeState("RECONNECT");
          logError("WARN_RT_RECONNECT", "Reconnecting", { status: rtLastStatus, ageMs: age, backoffMs: wait });
          setTimeout(() => { try { subscribe(); } catch (_) {} }, wait);
        }
      }, RT_WATCHDOG_MS);
    }
    function stopRealtimeWatchdog() {
      if (rtWatchdogTimer) { clearInterval(rtWatchdogTimer); rtWatchdogTimer = null; }
    }

    // ─────────────────────────────────────────────────
    // REALTIME UPSERT (live_positions)
    // ─────────────────────────────────────────────────
    function upsertRealtime(row) {
      if (!map || !row?.driver_id) return;
      const rawId = (row.driver_id ?? "").toString();
      const driverKey = normId(rawId); if (!driverKey) return;
      const lat = Number(row.lat), lng = Number(row.lng);
      if (!isValidLatLng(lat, lng)) return;
      const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
      rememberDriverSignal(driverKey, ts);
      if (Date.now() - ts > RIDE_FRESH_MS) return;

      if (endedDrivers.has(driverKey)) {
        const endedAt = endedDriverAt.get(driverKey) || 0;
        if (ts <= endedAt + 20_000) return; // altes/spätes Restsignal nach manuellem Ende ignorieren
        recentlyEnded.delete(driverKey);
        endedDrivers.delete(driverKey);
        endedDriverAt.delete(driverKey);
      }

      if (currentFilterKey) {
        if (driverKey !== currentFilterKey) return;
        positions.set(driverKey, { rawId, lng, lat, ts });
      } else {
        positions.set(driverKey, { rawId, lng, lat, ts });
      }

      const now = Date.now(), minTs = now - ROUTE_MS;
      const arr = routePoints.get(driverKey) ?? [];
      arr.push({ lng, lat, ts });
      while (arr.length && arr[0].ts < minTs) arr.shift();
      if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
      routePoints.set(driverKey, arr);

      refreshDriversSource("upsertRealtime"); refreshRoutesSource(); setLast(new Date());
      const sinceOk = Date.now() - (lastImpactOkAt || 0);
      if (shouldPollImpact() && sinceOk > 3000) fetchImpactOnce().catch(() => {});
    }

    const pulseTimer = setInterval(() => {
      if (!map || !isTabVisible() || !map.getSource(DRIVERS_SOURCE)) return;
      const hasLiveDriver = [...positions.keys()].some((driverKey) =>
        hasPublicRideForDriver(driverKey) && getDriverRouteState(driverKey) === "active"
      );
      if (!hasLiveDriver) return;
      refreshDriversSource("pulseTimer");
      map.triggerRepaint?.();
    }, 180);

    // ─────────────────────────────────────────────────
    // PRUNE STALE POSITIONS
    // ─────────────────────────────────────────────────
    const pruneTimer = setInterval(() => {
      const now = Date.now();
      let driversChanged = false;

      // Nur echte Altlasten aus positions entfernen.
      // Active rides bleiben sichtbar, solange die Fahrt aktiv ist.
      for (const [key, p] of positions.entries()) {
        if (now - (p?.ts || 0) <= RIDE_FRESH_MS) continue;
        if (activeRides.size > 0 && [...activeRides.values()].some((ride) => normId(ride.driver_id) === key)) continue;
        positions.delete(key);
        driversChanged = true;
      }

      if (driversChanged) { refreshDriversSource("pruneTimer"); refreshRoutesSource(); refreshRidesSource(); }
    }, PRUNE_EVERY_MS);

    // ─────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────
    function initMap() {
      if (!validateConfigOrFail()) return;
      sb  = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
      map = initMapbox();
      if (!map) return;

      map.on("click", (e) => {
        if (markerPopup) { markerPopup.remove(); markerPopup = null; }
        if (ridePopup)   { ridePopup.remove();   ridePopup   = null; }
        // Mitfahrer: Kartenklick setzt nur einen Pending-Marker, Modi bleiben getrennt.
        if (paxMarkerMode) {
          // Treffpunkt per Kartenklick nur vorpositionieren; bestaetigt wird per Button
          if (!isPaxInputLocked()) {
            setPaxPendingMarkerPos(e.lngLat.lng, e.lngLat.lat);
            paxPickupEditOpen = true;
            showHint("Treffpunkt fixieren, wenn die Position passt.");
            updatePaxUI();
          }
          // Bei Cooldown: Modus bleibt aktiv, Klick wird ignoriert
        } else if (paxTargetMode) {
          // Ziel per Kartenklick nur vorpositionieren; bestaetigt wird per Button
          if (!isPaxInputLocked() && !paxSearchActive) {
            setPaxPendingTargetPos(e.lngLat.lng, e.lngLat.lat);
            showHint("Ziel fixieren, wenn die Position passt.");
            updatePaxUI();
          }
        }
      });

      const PANEL_STATES = ["collapsed", "mid", "half"];
      let panelState = "collapsed";

      function getPanelEl() {
        return document.getElementById("bottomPanel") || document.querySelector(".panel");
      }
      function getPanelState() {
        return panelState;
      }
      function setPanelState(nextState) {
        const panel = getPanelEl();
        const handle = document.querySelector("#panelTitle .panel-handle");
        if (!panel || !PANEL_STATES.includes(nextState)) return;
        panelState = nextState;
        panel.dataset.panelState = nextState;
        panel.classList.toggle("collapsed", nextState === "collapsed");
        panel.classList.toggle("panel-mid", nextState === "mid");
        panel.classList.toggle("panel-half", nextState === "half");
        panel.classList.remove("panel-full");
        panel.classList.remove("open");
        if (handle) handle.setAttribute("aria-expanded", nextState === "collapsed" ? "false" : "true");
        if (nextState === "collapsed") hideHint();
        onVisibilityOrPanelChange();
      }

      function initBottomPanel() {
        const panel = getPanelEl();
        const shell = document.getElementById("panelShell");
        const title = document.getElementById("panelTitle");
        const handle = title?.querySelector(".panel-handle");
        const dragTarget = handle || title;
        if (!panel || !shell || !title || !dragTarget || panel.dataset.bottomPanelReady === "1") return;
        panel.dataset.bottomPanelReady = "1";

        const DRAG_THRESHOLD = 5;
        let pointerId = null;
        let dragging = false;
        let moved = false;
        let startY = 0;
        let startH = 0;
        let currentH = 0;
        let suppressClickUntil = 0;

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const getShellHeight = () => shell.getBoundingClientRect().height || shell.offsetHeight || 1;
        const setHeightPx = (px) => {
          shell.style.transition = "none";
          shell.style.height = `${px}px`;
        };
        const clearDragHeight = () => {
          shell.style.transition = "";
          shell.style.height = "";
        };
        const pickSnapState = (height = getShellHeight()) => {
          const vh = window.innerHeight;
          if (height > vh * 0.44) return "half";
          if (height > vh * 0.20) return "mid";
          return "collapsed";
        };

        dragTarget.addEventListener("pointerdown", (e) => {
          pointerId = e.pointerId;
          dragging = true;
          moved = false;
          startY = e.clientY;
          startH = getShellHeight();
          currentH = startH;
          shell.style.transition = "none";
          dragTarget.setPointerCapture?.(pointerId);
        });

        dragTarget.addEventListener("pointermove", (e) => {
          if (!dragging || e.pointerId !== pointerId) return;
          const dy = startY - e.clientY;
          const next = clamp(startH + dy, 60, window.innerHeight * 0.85);
          if (Math.abs(next - startH) > DRAG_THRESHOLD) moved = true;
          currentH = next;
          setHeightPx(currentH);
        });

        const finishDrag = (e) => {
          if (!dragging || (e && e.pointerId !== pointerId)) return;
          const finalH = moved ? currentH : getShellHeight();
          dragging = false;
          dragTarget.releasePointerCapture?.(pointerId);
          pointerId = null;
          clearDragHeight();
          if (moved) {
            suppressClickUntil = Date.now() + 250;
            setPanelState(pickSnapState(finalH));
          }
        };

        dragTarget.addEventListener("pointerup", finishDrag);
        dragTarget.addEventListener("pointercancel", finishDrag);
        dragTarget.addEventListener("lostpointercapture", finishDrag);
        const togglePanelFromTap = (e) => {
          if (Date.now() < suppressClickUntil) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          setPanelState(getPanelState() === "collapsed" ? "half" : "collapsed");
        };
        dragTarget.addEventListener("click", togglePanelFromTap);
        dragTarget.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") togglePanelFromTap(e);
        });
        setPanelState(panel.dataset.panelState || "collapsed");
      }

      initBottomPanel();

      document.addEventListener("visibilitychange", () => { onVisibilityOrPanelChange(); });

      const debouncedReload = debounce(async (source = "unknown") => {
        if (!map || currentFilterKey) return;
        await fetchLatest().catch(() => {});           // erst Positionen
        await fetchActiveRides().catch(() => {});      // dann Rides (filter greift jetzt)
        await fetchRouteHistory().catch(() => {});
      }, BBOX_DEBOUNCE_MS);

      onMoveEnd = () => {
        debouncedReload("moveend");
      };
      onZoomEnd = () => {
        debouncedReload("zoomend");
      };
      map.on("moveend", onMoveEnd);
      map.on("zoomend", onZoomEnd);

      // Reihenfolge wichtig: erst Positionen laden, dann Rides filtern
      // Sonst ist positions noch leer und stale Rides werden trotzdem eingelesen
      fetchLatest()
        .catch(e => logError("ERR_INIT_FETCH_LATEST", e?.message || String(e)))
        .then(() => fetchActiveRides())
        .catch(e => logError("ERR_INIT_FETCH_RIDES", e?.message || String(e)));
      fetchRouteHistory().catch(e => logError("ERR_INIT_FETCH_ROUTE", e?.message || String(e)));

      subscribe();
      subscribeRides(); // NEU

      // Periodischer Rides-Poll (5s) als Fallback falls Realtime nicht feuert
      ridesPolTimer = setInterval(() => {
        if (isTabVisible()) fetchActiveRides().catch(() => {});
      }, 5_000);

      // Modus-Umschalter initialisieren
      renderModeUI();

      onVisibilityOrPanelChange();
    }

    // ─────────────────────────────────────────────────
    // CLEANUP
    // ─────────────────────────────────────────────────
    function cleanup() {
      try { clearInterval(pruneTimer); }    catch (_) {}
      try { clearInterval(pulseTimer); }    catch (_) {}
      try { clearImpactTimer(); }           catch (_) {}
      try { stopRealtimeWatchdog(); }       catch (_) {}
      try { if (map && onMoveEnd) map.off("moveend", onMoveEnd); } catch (_) {}
      try { if (map && onZoomEnd) map.off("zoomend", onZoomEnd); } catch (_) {}
      try { if (sb && channel)       sb.removeChannel(channel);       } catch (_) {}
      try { if (sb && ridesChannel)  sb.removeChannel(ridesChannel);  } catch (_) {}
      try { if (ridesPolTimer) clearInterval(ridesPolTimer); } catch (_) {}
      try { if (map && map.getLayer(LAYER_RIDE_ROUTES)) map.removeLayer(LAYER_RIDE_ROUTES); } catch (_) {}
      try { if (map && map.getSource(RIDES_ROUTE_SOURCE)) map.removeSource(RIDES_ROUTE_SOURCE); } catch (_) {}
      try { if (map && map.getLayer(LAYER_PAX_MATCH)) map.removeLayer(LAYER_PAX_MATCH); } catch (_) {}
      try { if (map && map.getSource(PAX_MATCH_SOURCE)) map.removeSource(PAX_MATCH_SOURCE); } catch (_) {}
      try { if (paxCooldownTimer) { clearInterval(paxCooldownTimer); paxCooldownTimer = null; } } catch (_) {}
      try { if (paxTargetMarker) { paxTargetMarker.remove(); paxTargetMarker = null; } } catch (_) {}
      try { if (markerPopup) markerPopup.remove(); } catch (_) {}
      try { if (ridePopup)   ridePopup.remove();   } catch (_) {} // NEU
      try { if (map) map.remove(); } catch (_) {}
    }

    window.addEventListener("beforeunload", cleanup);
    window.addEventListener("pagehide",     cleanup);
    function applyTheme(theme, updateMap = true) {
      currentTheme = theme;
      document.body.classList.toggle("theme-light", theme === "light");
      const btn = document.getElementById("themeToggle");
      if (btn) {
        btn.textContent = theme === "light" ? "☀" : "◑";
        btn.style.color = theme === "light" ? "#111111" : "#ffffff";
        btn.style.background = "transparent";
      }
      localStorage.setItem("ecoride-theme", theme);
      if (!updateMap || !map) return;
      map.setStyle(MAP_STYLES[theme]);
      // Layers nach Style-Wechsel neu hinzufügen
      map.once("style.load", () => {
        routesReady = false;
        initMapboxLayers(map);
        refreshDriversSource("style-load");
        refreshRoutesSource();
        refreshRidesSource();
      });
    }

    function toggleTheme() {
      applyTheme(currentTheme === "dark" ? "light" : "dark");
    }

    function initMapboxLayers(m) {

        m.addSource("er-routes", { type:"geojson", data:{type:"FeatureCollection",features:[]} });

        m.on("mouseenter","er-routes-line",()=>{m.getCanvas().style.cursor="pointer";});
        m.on("mouseleave","er-routes-line",()=>{m.getCanvas().style.cursor="";});
      }
      if (!m.getSource("er-selected-route")) {
        m.addSource("er-selected-route", { type:"geojson", data:{type:"FeatureCollection",features:[]} });
      }
      // Fahrer
      if (!m.getSource(DRIVERS_SOURCE)) {
        m.addSource(DRIVERS_SOURCE,{type:"geojson",data:{type:"FeatureCollection",features:[]},cluster:true,clusterRadius:48,clusterMaxZoom:14});
        m.addLayer({id:LAYER_CLUSTER_CIRCLE,type:"circle",source:DRIVERS_SOURCE,filter:["has","point_count"],paint:{"circle-radius":["step",["get","point_count"],16,25,20,50,26,100,32],"circle-color":"rgba(199,223,58,0.70)","circle-stroke-width":1,"circle-stroke-color":"rgba(17,24,37,0.35)"}});
        m.addLayer({id:LAYER_CLUSTER_COUNT,type:"symbol",source:DRIVERS_SOURCE,filter:["has","point_count"],layout:{"text-field":["get","point_count_abbreviated"],"text-font":["DIN Offc Pro Medium","Arial Unicode MS Bold"],"text-size":12},paint:{"text-color":"#0b0f14"}});
        m.addLayer({id:`${LAYER_POINTS}-pulse`,type:"circle",source:DRIVERS_SOURCE,filter:["all",["!",["has","point_count"]],["==",["get","isLive"],1]],paint:{"circle-radius":["+",9.2,["*",["get","pulseScale"],1.6]],"circle-color":"rgba(34,197,94,0)","circle-stroke-color":"rgba(34,197,94,0.88)","circle-stroke-width":["+",1.1,["*",["-",1,["get","pulseScale"]],0.9]],"circle-opacity":["get","pulseOpacity"]}});
        m.addLayer({id:`${LAYER_POINTS}-ring`,type:"circle",source:DRIVERS_SOURCE,filter:["all",["!",["has","point_count"]]],paint:{"circle-radius":10,"circle-color":"rgba(255,255,255,0)","circle-stroke-color":["case",["==",["get","stale"],1],"rgba(255,255,255,0.68)","rgba(255,255,255,0.88)"],"circle-stroke-width":2.5,"circle-opacity":["case",["==",["get","stale"],1],0.68,0.96]}});
        m.addLayer({id:LAYER_POINTS,type:"circle",source:DRIVERS_SOURCE,filter:["all",["!",["has","point_count"]]],paint:{"circle-radius":6.5,"circle-color":["case",["==",["get","stale"],1],"#6B7A8F","rgba(199,223,58,0.98)"],"circle-opacity":["case",["==",["get","stale"],1],0.58,1],"circle-stroke-width":1,"circle-stroke-color":"rgba(11,15,20,0.18)"}});
        m.addLayer({id:LAYER_POINTS_SELECTED,type:"circle",source:DRIVERS_SOURCE,filter:["all",["!",["has","point_count"]],["==",["get","driverKey"],"__none__"]],paint:{"circle-radius":12,"circle-color":"rgba(255,255,255,0)","circle-stroke-width":3,"circle-stroke-color":"#60a5fa","circle-opacity":0.92}});
        m.on("click",LAYER_CLUSTER_CIRCLE,(e)=>{const f=e.features?.[0];if(!f)return;m.getSource(DRIVERS_SOURCE).getClusterExpansionZoom(f.properties.cluster_id,(err,zoom)=>{if(!err)m.easeTo({center:f.geometry.coordinates,zoom,duration:550});});});
        m.on("click",LAYER_POINTS,async(e)=>{const f=e.features?.[0];if(!f)return;m.easeTo({center:f.geometry.coordinates,zoom:14,duration:650});openMarkerPopupFromFeature(f);await fetchLatest().catch(()=>{});await fetchRouteHistory().catch(()=>{});refreshDriversSource("driver-marker-click");onVisibilityOrPanelChange();});
        m.on("mouseenter",LAYER_CLUSTER_CIRCLE,()=>{m.getCanvas().style.cursor="pointer";});
        m.on("mouseleave",LAYER_CLUSTER_CIRCLE,()=>{m.getCanvas().style.cursor="";});
        m.on("mouseenter",LAYER_POINTS,()=>{m.getCanvas().style.cursor="pointer";});
        m.on("mouseleave",LAYER_POINTS,()=>{m.getCanvas().style.cursor="";});
      }
      // Ride-Routen
      if (!m.getSource(RIDES_ROUTE_SOURCE)) {
        m.addSource(RIDES_ROUTE_SOURCE,{type:"geojson",data:{type:"FeatureCollection",features:[]}});
        m.addLayer({
          id:LAYER_RIDE_ROUTES,
          type:"line",
          source:RIDES_ROUTE_SOURCE,
          filter:["==",["get","stale"],0],
          layout:{"line-join":"round","line-cap":"round"},
          paint:{"line-color":"#B7D532","line-width":4,"line-opacity":0.92}
        });
        m.addLayer({
          id:`${LAYER_RIDE_ROUTES}-stale`,
          type:"line",
          source:RIDES_ROUTE_SOURCE,
          filter:["==",["get","stale"],1],
          layout:{"line-join":"round","line-cap":"round"},
          paint:{"line-color":"#6B7A8F","line-width":2.5,"line-opacity":0.7,"line-dasharray":[2,2]}
        });
      }
      if (m.getSource("er-selected-route") && !m.getLayer("er-selected-route-line")) {
        m.addLayer({
          id:"er-selected-route-line",
          type:"line",
          source:"er-selected-route",
          layout:{"line-join":"round","line-cap":"round","visibility": routesVisible ? "visible" : "none"},
          paint:{"line-color":"#60a5fa","line-width":6,"line-opacity":0.96}
        });
      }
      // Ride-Ziele
      if (!m.getSource(RIDES_SOURCE)) {
        m.addSource(RIDES_SOURCE,{type:"geojson",data:{type:"FeatureCollection",features:[]}});
        m.addLayer({id:LAYER_RIDE_DEST,type:"circle",source:RIDES_SOURCE,paint:{"circle-radius":10,"circle-color":"#ff9500","circle-opacity":["case",["==",["get","stale"],1],0.65,0.92],"circle-stroke-width":2.5,"circle-stroke-color":"rgba(255,255,255,0.80)"}});
        m.on("click",LAYER_RIDE_DEST,(e)=>{e.originalEvent?.stopPropagation();const f=e.features?.[0];if(!f)return;m.easeTo({center:f.geometry.coordinates,zoom:14,duration:550});openRidePopup(f);});
        m.on("mouseenter",LAYER_RIDE_DEST,()=>{m.getCanvas().style.cursor="pointer";});
        m.on("mouseleave",LAYER_RIDE_DEST,()=>{m.getCanvas().style.cursor="";});
      }
      // Mitfahrer-Match-Highlight (Ring um passende Fahrer)
      if (!m.getSource(PAX_MATCH_SOURCE)) {
        m.addSource(PAX_MATCH_SOURCE,{type:"geojson",data:{type:"FeatureCollection",features:[]}});
        m.addLayer({
          id: LAYER_PAX_MATCH, type:"circle", source:PAX_MATCH_SOURCE,
          paint:{
            "circle-radius": 14,
            "circle-color":  "rgba(96,165,250,0.0)",
            "circle-stroke-width": 3,
            "circle-stroke-color": "#60a5fa",
            "circle-stroke-opacity": 0.92,
          }
        });
      }
      refreshSelectedRouteSource();
      const btn=document.getElementById("btnToggleRoutes");
      if(btn)btn.textContent=routesVisible?"Ausblenden":"Einblenden";
      routesReady=true;
    }

    document.addEventListener("DOMContentLoaded", initMap);
    document.addEventListener("DOMContentLoaded", () => {
      initAccordionHandlers();
      initPaxPickupLocationSearch();
      initPaxTargetLocationSearch();
      applyTheme(currentTheme, false);
      document.getElementById("themeToggle")?.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleTheme();
      });
      document.getElementById("themeToggle")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleTheme();
        }
      });
    });
  </script>
</body>
</html>
